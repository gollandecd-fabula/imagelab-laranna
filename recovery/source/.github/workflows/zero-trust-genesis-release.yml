name: ImageLab Genesis First Release Gate

on:
  workflow_dispatch:
    inputs:
      qualification_run_id:
        description: Completed ImageLab Zero-Trust Release Gate run containing the exact qualified candidate
        required: true
        type: string
      qualification_head_sha:
        description: Exact 40-character commit SHA used by the qualification run
        required: true
        type: string
      physical_l5_release_tag:
        description: Release tag containing the externally produced physical L5 manifest and evidence bundle
        required: true
        type: string
      physical_l5_manifest_sha256:
        description: Independently pinned SHA-256 of ImageLab-PHYSICAL-L5.json
        required: true
        type: string
      physical_l5_bundle_sha256:
        description: Independently pinned SHA-256 of ImageLab-PHYSICAL-L5-EVIDENCE.zip
        required: true
        type: string
      enable_attestation:
        description: Generate GitHub artifact attestation when repository plan supports it
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: imagelab-genesis-first-release
  cancel-in-progress: false

env:
  PYTHONUTF8: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  genesis-contracts:
    name: Genesis protocol and adversarial contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13.14'
      - name: Install exact application and test dependencies
        run: |
          python -m pip install --requirement requirements.txt
          python -m pip install pytest==8.4.2 httpx==0.28.1
      - name: Compile genesis release contracts
        run: >-
          python -m compileall -q
          release_gate/genesis/verify_no_prior_release.py
          release_gate/genesis/finalize_gate.py
          tests/test_genesis_release_gate.py
      - name: Run focused genesis release tests
        run: python -m pytest tests/test_genesis_release_gate.py -vv --tb=short

  final-genesis-verdict:
    name: One-time fail-closed genesis release authorization
    needs: genesis-contracts
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13.14'

      - name: Capture exact qualification run and evidence artifacts
        id: qualification
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
          QUALIFICATION_HEAD_SHA: ${{ inputs.qualification_head_sha }}
        run: |
          set -euo pipefail
          [[ "$QUALIFICATION_RUN_ID" =~ ^[0-9]+$ ]] || { echo "qualification_run_id must be numeric"; exit 1; }
          [[ "$QUALIFICATION_HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "qualification_head_sha must be an exact commit SHA"; exit 1; }
          mkdir -p aggregate/qualification aggregate/qualification-verdict
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QUALIFICATION_RUN_ID" > aggregate/qualification/run-metadata.json
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$QUALIFICATION_RUN_ID/artifacts?per_page=100" --jq '.artifacts[].name' > aggregate/qualification/artifact-names.txt
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("aggregate/qualification")
          meta = json.loads((root / "run-metadata.json").read_text("utf-8"))
          names = [line.strip() for line in (root / "artifact-names.txt").read_text("utf-8").splitlines() if line.strip()]
          result = {
              "schema": 1,
              "status": "PASS",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "run_id": int(os.environ["QUALIFICATION_RUN_ID"]),
              "head_sha": str(meta.get("head_sha") or ""),
              "workflow_name": str(meta.get("name") or ""),
              "event": str(meta.get("event") or ""),
              "conclusion": str(meta.get("conclusion") or ""),
              "artifact_names": names,
          }
          expected = {
              "head_sha": os.environ["QUALIFICATION_HEAD_SHA"].lower(),
              "workflow_name": "ImageLab Zero-Trust Release Gate",
              "event": "workflow_dispatch",
              "conclusion": "failure",
          }
          errors = [field for field, value in expected.items() if str(result.get(field, "")).lower() != value.lower()]
          required = {
              "ztr-source-evidence",
              "ztr-unit-verdict",
              "UNVERIFIED_INTERNAL_EXACT_CANDIDATE",
              "ztr-clean-install-evidence",
              "ztr-independent-evidence",
              "ImageLab-RELEASE-VERDICT",
          }
          if not required.issubset(set(names)):
              errors.append("artifact_names")
          if errors:
              result["status"] = "FAIL"
              result["failed_fields"] = sorted(set(errors))
          (root / "qualification-run.json").write_text(json.dumps(result, indent=2), "utf-8")
          raise SystemExit(0 if result["status"] == "PASS" else 1)
          PY
          gh run download "$QUALIFICATION_RUN_ID" -n ztr-source-evidence -D aggregate/source
          gh run download "$QUALIFICATION_RUN_ID" -n ztr-unit-verdict -D aggregate/unit
          gh run download "$QUALIFICATION_RUN_ID" -n UNVERIFIED_INTERNAL_EXACT_CANDIDATE -D aggregate/build
          gh run download "$QUALIFICATION_RUN_ID" -n ztr-clean-install-evidence -D aggregate/clean
          gh run download "$QUALIFICATION_RUN_ID" -n ztr-independent-evidence -D aggregate/independent
          gh run download "$QUALIFICATION_RUN_ID" -n ImageLab-RELEASE-VERDICT -D aggregate/qualification-verdict

      - name: Prove that no prior authorized release exists
        id: genesis_absence
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p aggregate/genesis
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > aggregate/genesis/releases.json
          python release_gate/genesis/verify_no_prior_release.py \
            --releases-json aggregate/genesis/releases.json \
            --repository "$GITHUB_REPOSITORY" \
            --output aggregate/genesis/genesis-baseline-verification.json

      - name: Download and pin physical user-machine L5 evidence
        id: physical_l5
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PHYSICAL_TAG: ${{ inputs.physical_l5_release_tag }}
          PHYSICAL_MANIFEST_SHA256: ${{ inputs.physical_l5_manifest_sha256 }}
          PHYSICAL_BUNDLE_SHA256: ${{ inputs.physical_l5_bundle_sha256 }}
        run: |
          set -euo pipefail
          [[ "$PHYSICAL_MANIFEST_SHA256" =~ ^[0-9a-fA-F]{64}$ ]] || { echo "physical manifest SHA-256 is invalid"; exit 1; }
          [[ "$PHYSICAL_BUNDLE_SHA256" =~ ^[0-9a-fA-F]{64}$ ]] || { echo "physical bundle SHA-256 is invalid"; exit 1; }
          mkdir -p aggregate/physical
          gh release download "$PHYSICAL_TAG" --pattern 'ImageLab-PHYSICAL-L5.json' --dir aggregate/physical --clobber
          gh release download "$PHYSICAL_TAG" --pattern 'ImageLab-PHYSICAL-L5-EVIDENCE.zip' --dir aggregate/physical --clobber
          test "$(find aggregate/physical -maxdepth 1 -name 'ImageLab-PHYSICAL-L5.json' -type f | wc -l)" -eq 1
          test "$(find aggregate/physical -maxdepth 1 -name 'ImageLab-PHYSICAL-L5-EVIDENCE.zip' -type f | wc -l)" -eq 1
          echo "$PHYSICAL_MANIFEST_SHA256  aggregate/physical/ImageLab-PHYSICAL-L5.json" | sha256sum --check --strict
          echo "$PHYSICAL_BUNDLE_SHA256  aggregate/physical/ImageLab-PHYSICAL-L5-EVIDENCE.zip" | sha256sum --check --strict

      - name: Generate one-time genesis verdict and authorized copy
        id: finalize
        if: ${{ always() }}
        continue-on-error: true
        run: >-
          python release_gate/genesis/finalize_gate.py
          --aggregate-dir aggregate
          --output-dir authorized-release
          --repository "${{ github.repository }}"
          --qualification-run-id "${{ inputs.qualification_run_id }}"
          --qualification-head-sha "${{ inputs.qualification_head_sha }}"
          --physical-manifest-sha256 "${{ inputs.physical_l5_manifest_sha256 }}"
          --physical-bundle-sha256 "${{ inputs.physical_l5_bundle_sha256 }}"

      - name: Attest exact genesis-authorized release outputs
        if: ${{ steps.finalize.outcome == 'success' && inputs.enable_attestation }}
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6
        with:
          subject-path: authorized-release/*
          create-storage-record: false

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: ImageLab-GENESIS-RELEASE-VERDICT
          path: authorized-release/
          retention-days: 90
          if-no-files-found: error

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: ${{ steps.finalize.outcome == 'success' }}
        with:
          name: ImageLab-GENESIS-RELEASE-AUTHORIZED
          path: |
            authorized-release/*.exe
            authorized-release/ImageLab-RELEASE-AUTHORIZATION.json
          retention-days: 90
          if-no-files-found: error

      - name: Enforce fail-closed genesis verdict
        if: ${{ steps.finalize.outcome != 'success' }}
        run: |
          echo "Genesis release blocked. See ImageLab-GENESIS-RELEASE-VERDICT."
          exit 1
