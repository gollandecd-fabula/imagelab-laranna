[project]
name = "imagelab-laranna"
version = "1.0.0"
description = "ImageLab by LarannA local AI-M6 candidate"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn>=0.35,<1",
  "python-multipart>=0.0.20,<1",
  "Pillow>=11,<13",
  "numpy>=2,<3",
  "opencv-python-headless>=4.10,<5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
