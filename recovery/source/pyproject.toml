[project]
name = "imagelab-laranna"
version = "1.0.0"
description = "ImageLab by LarannA local AI-M6 candidate"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.139.2",
  "starlette==1.3.1",
  "pydantic==2.13.4",
  "uvicorn==0.48.0",
  "click==8.3.3",
  "python-multipart==0.0.31",
  "Pillow==12.3.0",
  "numpy==2.3.5",
  "opencv-python-headless==4.13.0.92",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
