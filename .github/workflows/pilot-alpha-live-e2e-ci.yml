name: ImageLab Pilot Alpha LIVE-E2E-01

on:
  pull_request:
    branches: [redteam/imagelab-complete-audit-20260725-v2]
    paths:
      - recovery/source/app/**
      - recovery/source/tests/live_e2e_01.py
      - recovery/source/tests/fixtures/pilot_v1/**
      - recovery/source/tools/generate_pilot_frozen_set.py
      - recovery/source/requirements.txt
      - .github/workflows/pilot-alpha-live-e2e-ci.yml
  push:
    branches: [pilot/controlled-vertical-alpha-v1-3-1]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: imagelab-pilot-live-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live-e2e-foundation:
    name: Real FastAPI project upload mask restart reopen
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: recovery/source
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind exact Pilot candidate SHA
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          require_exact() { test "$1" = "$2"; }
          require_exact "$actual" "$expected" || { echo "::error::candidate mismatch actual=$actual expected=$expected"; exit 1; }
          mismatch="${expected%?}0"
          test "$mismatch" != "$expected" || mismatch="${expected%?}1"
          if require_exact "$actual" "$mismatch"; then
            echo "::error::mismatched-SHA negative fixture was accepted"
            exit 1
          fi
          printf 'exact_candidate_sha=%s\n' "$actual"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13.14'
      - name: Install exact source dependencies
        run: python -m pip install -q --requirement requirements.txt
      - name: Generate exact Frozen Pilot Set v1
        run: python tools/generate_pilot_frozen_set.py
      - name: Enforce live-server test boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'uvicorn' tests/live_e2e_01.py
          grep -q 'http.client' tests/live_e2e_01.py
          ! grep -nE 'TestClient|monkeypatch|unittest\.mock|from mock|import mock' tests/live_e2e_01.py
      - name: Run LIVE-E2E-01 foundation route
        env:
          PILOT_EVIDENCE_DIR: artifacts/pilot-alpha
          PILOT_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python tests/live_e2e_01.py
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: ImageLab-LIVE-E2E-01-${{ github.event.pull_request.head.sha || github.sha }}
          path: recovery/source/artifacts/pilot-alpha/
          retention-days: 30
          if-no-files-found: error
