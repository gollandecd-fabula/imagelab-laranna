name: RETIRED — Historical RC13 Windows gate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: retired-rc13-windows-gate
  cancel-in-progress: false

jobs:
  retired:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail closed
        run: |
          echo "This historical workflow is retired and cannot change repository or release state."
          exit 1
