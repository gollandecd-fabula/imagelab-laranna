name: RETIRED — Recovery Promote Bootstrap RC13

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce retirement boundary
        run: |
          echo "RETIRED_WORKFLOW"
          echo "RC13 exact source was already promoted to bootstrap/zero-trust-gate."
          echo "This one-time workflow no longer has write permission and cannot modify the recovery branch."
          exit 1
