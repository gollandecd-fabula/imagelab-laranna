name: SINDEL C05C Prefill External R4

on:
  push:
    branches: [sindel-c05b-wheelhouse-r3]
    paths:
      - 'sindel/c05c/C05C_T3_PREFILL_EXTERNAL_R4.py'
      - 'sindel/c05c/C05C_T3_PREFILL_PARITY_GATE_R4.json'
      - '.github/workflows/sindel-c05c-prefill-external-r4.yml'

permissions:
  contents: read
  actions: read

jobs:
  export-external:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: STRAZHNIK gate - require P1 P2 P3 parity and open size gate
        shell: bash
        run: |
          set -euo pipefail
          G='sindel/c05c/C05C_T3_PREFILL_PARITY_GATE_R4.json'
          if [ ! -f "$G" ]; then
            echo 'FAIL-CLOSED: parity/size gate evidence is absent.' >&2
            exit 42
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('sindel/c05c/C05C_T3_PREFILL_PARITY_GATE_R4.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          expected_pte='967728e7cda4b0f636f9813d288dafe0759216f17b6c690063397b3b4d1ad459'
          expected_comparator='07edd15b3fcdf3af533b0b9090de8e20918997793b20a3b267665bcb09539c13'
          expected_thresholds={'cosine_min':0.9999,'mean_abs_max':0.005,'max_abs_max':0.05,'finite_required':True}
          errors=[]
          if d.get('schema')!='sindel.cp034.c05c.t3-prefill-parity-gate-r4.v1': errors.append('schema')
          if d.get('candidate_pte_sha256')!=expected_pte: errors.append('candidate_pte_sha256')
          if d.get('comparator_sha256')!=expected_comparator: errors.append('comparator_sha256')
          if d.get('thresholds')!=expected_thresholds: errors.append('thresholds')
          for probe in ('P1','P2','P3'):
              rec=d.get('parity',{}).get(probe,{})
              if rec.get('status')!='PASS_L2': errors.append(f'{probe}.status')
              if rec.get('fresh_process') is not True: errors.append(f'{probe}.fresh_process')
              if rec.get('real_executorch_forward') is not True: errors.append(f'{probe}.real_executorch_forward')
              if rec.get('outputs_compared')!=['logits','k','v']: errors.append(f'{probe}.outputs_compared')
              if not rec.get('evidence_sha256'): errors.append(f'{probe}.evidence_sha256')
          sg=d.get('size_gate',{})
          if sg.get('status')!='OPEN': errors.append('size_gate.status')
          if not sg.get('evidence_sha256'): errors.append('size_gate.evidence_sha256')
          if d.get('golden_published') is not False: errors.append('golden_published')
          if errors: raise SystemExit('FAIL-CLOSED: invalid parity/size gate: '+', '.join(errors))
          print('STRAZHNIK_GATE_PASS')
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.15'
          check-latest: false

      - name: Restore exact frozen export environment artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ENVART="$RUNNER_TEMP/C05C_EXPORT_ENV_R3"
          mkdir -p "$ENVART"
          gh run download 35055036918 -R "$GITHUB_REPOSITORY" -n C05C_EXPORT_ENV_R3 -D "$ENVART"
          LOCK=$(find "$ENVART" -name C05C_EXPORT_ENV_LOCK_R3.json -print -quit)
          test -n "$LOCK"
          BASE=$(dirname "$LOCK")
          test "$(sha256sum "$BASE/C05C_EXPORT_ENV_LOCK_R3.json" | awk '{print $1}')" = '05ab0315a31ad48ef36b834b2305ea3c59dabe13ed104beb752d65686b7449d2'
          test "$(sha256sum "$BASE/requirements.offline.freeze.txt" | awk '{print $1}')" = '52d2ac268b1defd446e6778c612c2de6b3a889165e0cd0737f927d264e6797b5'
          test "$(sha256sum "$BASE/SHA256SUMS.txt" | awk '{print $1}')" = 'b2a20ae23f146bb165819f1343c166db697112c81c56c9523b572576368d8193'
          (cd "$BASE" && sha256sum -c SHA256SUMS.txt)
          python -m venv "$RUNNER_TEMP/c05c_exact_env"
          "$RUNNER_TEMP/c05c_exact_env/bin/python" -m pip install --disable-pip-version-check --no-input --no-index --find-links "$BASE/wheelhouse" -r "$BASE/requirements.offline.freeze.txt"
          "$RUNNER_TEMP/c05c_exact_env/bin/python" -m pip freeze | LC_ALL=C sort > "$RUNNER_TEMP/c05c_exact.freeze.txt"
          cmp -s "$RUNNER_TEMP/c05c_exact.freeze.txt" "$BASE/requirements.offline.freeze.txt"
          "$RUNNER_TEMP/c05c_exact_env/bin/python" - <<'PY'
          import importlib.metadata as md, numpy, torch, torchaudio
          assert torch.__version__=='2.10.0+cpu'
          assert torchaudio.__version__=='2.10.0+cpu'
          assert numpy.__version__=='2.4.6'
          assert md.version('executorch')=='1.1.0'
          print('EXACT_FROZEN_ENV_PASS')
          PY
          echo "SINDEL_PY=$RUNNER_TEMP/c05c_exact_env/bin/python" >> "$GITHUB_ENV"

      - name: Prepare frozen source and exact T3 V3
        shell: bash
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/sindel_c05c_work"
          mkdir -p "$W/source" "$W/model"
          git clone --quiet https://github.com/resemble-ai/chatterbox.git "$RUNNER_TEMP/chatterbox"
          git -C "$RUNNER_TEMP/chatterbox" checkout --quiet 5de7a54aa4e5e2baadb0182dde554908b48b85c2
          test "$(git -C "$RUNNER_TEMP/chatterbox" rev-parse HEAD)" = '5de7a54aa4e5e2baadb0182dde554908b48b85c2'
          cp -a "$RUNNER_TEMP/chatterbox/src/chatterbox" "$W/source/"
          "$SINDEL_PY" - <<'PY'
          from huggingface_hub import hf_hub_download
          from pathlib import Path
          import hashlib, shutil, os
          W=Path(os.environ['RUNNER_TEMP'])/'sindel_c05c_work'
          src=Path(hf_hub_download(repo_id='ResembleAI/chatterbox', filename='t3_mtl23ls_v3.safetensors'))
          dst=W/'model/t3_mtl23ls_v3.safetensors'; shutil.copy2(src,dst)
          h=hashlib.sha256(dst.read_bytes()).hexdigest()
          assert h=='5abca8321ede76f8e61f1cc0d19aea6c946b28871017ce8726f8a69203f05953', h
          print('T3_SHA_PASS',h)
          PY
          test "$(git hash-object sindel/c05c/C05C_T3_PREFILL_R3C.py)" = '1be8e6975c68ae6f2111b481a5ba6f5e305717ae'
          test "$(sha256sum sindel/c05c/C05C_T3_PREFILL_R3C.py | awk '{print $1}')" = '0b6e906bf4066606992f9b562989569567f623715ffe62f9b9a91b59fab44971'

      - name: Export pre-lowering tagged external constants prototype
        shell: bash
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/sindel_c05c_work"
          export SINDEL_C05C_WORK="$W"
          export SINDEL_C05C_EXTERNAL_OUT="$RUNNER_TEMP"
          export OMP_NUM_THREADS=4 MKL_NUM_THREADS=4 OPENBLAS_NUM_THREADS=4
          export PATH="$(dirname "$SINDEL_PY"):$PATH"
          "$SINDEL_PY" -u sindel/c05c/C05C_T3_PREFILL_EXTERNAL_R4.py
          D="$RUNNER_TEMP/c05c_external_r4"
          test -s "$D/t3_prefill_external_r4.pte"
          test -s "$D/t3_shared.ptd"
          sha256sum "$D/t3_prefill_external_r4.pte" "$D/t3_shared.ptd" "$D/C05C_T3_PREFILL_EXTERNAL_R4_EXPORT.json" > "$D/SHA256SUMS.txt"
          split -b 300M -d -a 2 "$D/t3_shared.ptd" "$D/t3_shared.ptd.part."
          sha256sum "$D"/t3_shared.ptd.part.* > "$D/PTD_PART_SHA256SUMS.txt"

      - name: Real ExecuTorch PTE plus PTD forward smoke
        shell: bash
        run: |
          set -euo pipefail
          export OMP_NUM_THREADS=4 MKL_NUM_THREADS=4 OPENBLAS_NUM_THREADS=4
          "$SINDEL_PY" - <<'PY'
          import os, torch
          from executorch.extension.pybindings.portable_lib import _load_for_executorch_from_buffer
          d=os.path.join(os.environ['RUNNER_TEMP'],'c05c_external_r4')
          with open(os.path.join(d,'t3_prefill_external_r4.pte'),'rb') as f: pte=f.read()
          with open(os.path.join(d,'t3_shared.ptd'),'rb') as f: ptd=f.read()
          mod=_load_for_executorch_from_buffer(pte,ptd)
          ce=torch.zeros((1,34,1024),dtype=torch.float16)
          fixed=torch.zeros((2,258),dtype=torch.long)
          L=torch.tensor([66],dtype=torch.long)
          out=mod.forward((ce,fixed,L))
          assert len(out)==3
          assert all(torch.isfinite(x).all() for x in out)
          assert list(out[0].shape)==[2,8194]
          assert list(out[1].shape)==[30,2,16,294,64]
          assert list(out[2].shape)==[30,2,16,294,64]
          print('EXTERNAL_REAL_ET_FORWARD_SMOKE_PASS')
          PY

      - name: Upload PTE and evidence
        uses: actions/upload-artifact@v4
        with:
          name: SINDEL_C05C_T3_PREFILL_EXTERNAL_R4_META
          path: |
            ${{ runner.temp }}/c05c_external_r4/t3_prefill_external_r4.pte
            ${{ runner.temp }}/c05c_external_r4/C05C_T3_PREFILL_EXTERNAL_R4_EXPORT.json
            ${{ runner.temp }}/c05c_external_r4/SHA256SUMS.txt
            ${{ runner.temp }}/c05c_external_r4/PTD_PART_SHA256SUMS.txt
          compression-level: 0
          retention-days: 7
      - name: Upload PTD part 00
        uses: actions/upload-artifact@v4
        with:
          name: SINDEL_C05C_T3_SHARED_R4_PART00
          path: ${{ runner.temp }}/c05c_external_r4/t3_shared.ptd.part.00
          compression-level: 0
          retention-days: 7
      - name: Upload PTD part 01
        if: ${{ hashFiles(format('{0}/c05c_external_r4/t3_shared.ptd.part.01', runner.temp)) != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: SINDEL_C05C_T3_SHARED_R4_PART01
          path: ${{ runner.temp }}/c05c_external_r4/t3_shared.ptd.part.01
          compression-level: 0
          retention-days: 7
      - name: Upload PTD part 02
        if: ${{ hashFiles(format('{0}/c05c_external_r4/t3_shared.ptd.part.02', runner.temp)) != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: SINDEL_C05C_T3_SHARED_R4_PART02
          path: ${{ runner.temp }}/c05c_external_r4/t3_shared.ptd.part.02
          compression-level: 0
          retention-days: 7
      - name: Upload PTD part 03
        if: ${{ hashFiles(format('{0}/c05c_external_r4/t3_shared.ptd.part.03', runner.temp)) != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: SINDEL_C05C_T3_SHARED_R4_PART03
          path: ${{ runner.temp }}/c05c_external_r4/t3_shared.ptd.part.03
          compression-level: 0
          retention-days: 7
