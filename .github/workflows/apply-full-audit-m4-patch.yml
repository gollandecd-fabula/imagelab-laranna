name: TEMP Apply Full Audit M4 Patch

on:
  pull_request:
    branches:
      - bootstrap/zero-trust-gate
    paths:
      - .audit/m4.trigger

permissions:
  contents: write

concurrency:
  group: imagelab-temp-m4-patch-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply-reviewed-patch:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'redteam/imagelab-complete-audit-20260725-v2' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 2
      - name: Detect trigger
        id: gate
        run: |
          if [[ ! -f .audit/m4.trigger ]]; then
            echo 'apply=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'apply=true' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        if: ${{ steps.gate.outputs.apply == 'true' }}
        with:
          python-version: '3.13.14'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        if: ${{ steps.gate.outputs.apply == 'true' }}
        with:
          go-version: '1.24.5'
          cache: false
      - name: Verify and apply exact patch
        if: ${{ steps.gate.outputs.apply == 'true' }}
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only HEAD^ HEAD)
          [[ ${#changed[@]} -eq 1 && "${changed[0]}" == ".audit/m4.trigger" ]]
          [[ "$(cat .audit/m4.trigger)" == "APPLY-fcc1d10bc67c4cbb8b443ee02c3a778af92275e0eef54062c2cbbb69293cdb0c" ]]
          base64 --decode .audit/m4.patch.gz.b64 | gzip --decompress > /tmp/m4.patch
          echo 'fcc1d10bc67c4cbb8b443ee02c3a778af92275e0eef54062c2cbbb69293cdb0c  /tmp/m4.patch' | sha256sum --check --strict
          git apply --check /tmp/m4.patch
          git apply /tmp/m4.patch
          { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u > /tmp/changed.txt
          printf '%s\n' \
            .github/workflows/codex-evidence-hardening-ci.yml \
            recovery/source/windows_installer/installer/main.go \
            recovery/source/windows_installer/installer/main_test.go | sort -u > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
      - name: Validate exact patch
        if: ${{ steps.gate.outputs.apply == 'true' }}
        working-directory: recovery/source
        run: |
          set -euo pipefail
          python -m pip install --requirement requirements.txt
          python -m pip install pytest==8.4.2 httpx==0.28.1
          python -m pytest -q
          cd windows_installer/installer
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('payload.zip', 'w'):
              pass
          PY
          GO111MODULE=off GOOS=windows GOARCH=amd64 go test -c -o "$RUNNER_TEMP/installer-tests.exe" .
          rm payload.zip
      - name: Commit explicit tested paths
        if: ${{ steps.gate.outputs.apply == 'true' }}
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git add .github/workflows/codex-evidence-hardening-ci.yml recovery/source/windows_installer/installer/main.go recovery/source/windows_installer/installer/main_test.go
          git rm -f .audit/m4.patch.gz.b64 .audit/m4.trigger
          git config user.name 'ImageLab Audit Bot'
          git config user.email 'audit-bot@users.noreply.github.com'
          git commit -m 'Harden Windows installer archive admission [audit-patch-output]'
          git push origin "HEAD:$HEAD_BRANCH"
