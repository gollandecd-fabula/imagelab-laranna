name: SINDEL C05C A02 PTD A-B R5

on:
  push:
    branches: [sindel-cp034-a02-ptd-ab-20260917]
    paths:
      - 'sindel/c05c/C05C_T3_PTD_AB_DIAGNOSTIC_R5.py'
      - '.github/workflows/sindel-c05c-a02-ptd-ab-r5.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  a02-ptd-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.15'
          check-latest: false

      - name: Restore exact frozen export environment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/C05C_EXPORT_ENV_R3"
          mkdir -p "$E"
          gh run download 35055036918 -R "$GITHUB_REPOSITORY" -n C05C_EXPORT_ENV_R3 -D "$E"
          LOCK=$(find "$E" -name C05C_EXPORT_ENV_LOCK_R3.json -print -quit)
          test -n "$LOCK"
          BASE=$(dirname "$LOCK")
          test "$(sha256sum "$BASE/C05C_EXPORT_ENV_LOCK_R3.json" | awk '{print $1}')" = '05ab0315a31ad48ef36b834b2305ea3c59dabe13ed104beb752d65686b7449d2'
          test "$(sha256sum "$BASE/requirements.offline.freeze.txt" | awk '{print $1}')" = '52d2ac268b1defd446e6778c612c2de6b3a889165e0cd0737f927d264e6797b5'
          (cd "$BASE" && sha256sum -c SHA256SUMS.txt)
          python -m venv "$RUNNER_TEMP/c05c_exact_env"
          "$RUNNER_TEMP/c05c_exact_env/bin/python" -m pip install --disable-pip-version-check --no-input --no-index --find-links "$BASE/wheelhouse" -r "$BASE/requirements.offline.freeze.txt"
          "$RUNNER_TEMP/c05c_exact_env/bin/python" -m pip freeze | LC_ALL=C sort > "$RUNNER_TEMP/freeze.txt"
          cmp -s "$RUNNER_TEMP/freeze.txt" "$BASE/requirements.offline.freeze.txt"
          echo "SINDEL_PY=$RUNNER_TEMP/c05c_exact_env/bin/python" >> "$GITHUB_ENV"
          echo "SINDEL_C05C_WORK=$RUNNER_TEMP/sindel_c05c_work" >> "$GITHUB_ENV"
          echo "SINDEL_C05C_SHARED_OUT=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "SINDEL_C05C_A02_OUT=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "OMP_NUM_THREADS=4" >> "$GITHUB_ENV"
          echo "MKL_NUM_THREADS=4" >> "$GITHUB_ENV"
          echo "OPENBLAS_NUM_THREADS=4" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/c05c_exact_env/bin" >> "$GITHUB_PATH"

      - name: Static A02 preflight
        shell: bash
        run: |
          set -euo pipefail
          "$SINDEL_PY" -m py_compile \
            sindel/c05c/C05C_T3_SHARED_STORE_ISOLATED_R4.py \
            sindel/c05c/C05C_T3_SHARED_STORE_ISOLATED_R5.py \
            sindel/c05c/C05C_T3_PTD_AB_DIAGNOSTIC_R5.py
          "$SINDEL_PY" - <<'PY'
          import sys
          sys.path.insert(0, 'sindel/c05c')
          import C05C_T3_SHARED_STORE_ISOLATED_R5 as r5
          expected={'cosine_min':0.9999,'mean_abs_max':0.005,'max_abs_max':0.05,'finite_required':True}
          assert r5.THRESHOLDS == expected
          assert r5.CFG_WEIGHT == 0.03
          print('A02_STATIC_PRECHECK_PASS')
          PY

      - name: Prepare frozen source and exact T3 V3
        shell: bash
        run: |
          set -euo pipefail
          W="$SINDEL_C05C_WORK"
          mkdir -p "$W/source" "$W/model"
          git clone --quiet https://github.com/resemble-ai/chatterbox.git "$RUNNER_TEMP/chatterbox"
          git -C "$RUNNER_TEMP/chatterbox" checkout --quiet 5de7a54aa4e5e2baadb0182dde554908b48b85c2
          test "$(git -C "$RUNNER_TEMP/chatterbox" rev-parse HEAD)" = '5de7a54aa4e5e2baadb0182dde554908b48b85c2'
          cp -a "$RUNNER_TEMP/chatterbox/src/chatterbox" "$W/source/"
          "$SINDEL_PY" - <<'PY'
          from huggingface_hub import hf_hub_download
          from pathlib import Path
          import hashlib, shutil, os
          W=Path(os.environ['SINDEL_C05C_WORK'])
          src=Path(hf_hub_download(repo_id='ResembleAI/chatterbox', filename='t3_mtl23ls_v3.safetensors'))
          dst=W/'model/t3_mtl23ls_v3.safetensors'; shutil.copy2(src,dst)
          h=hashlib.sha256(dst.read_bytes()).hexdigest()
          assert h=='5abca8321ede76f8e61f1cc0d19aea6c946b28871017ce8726f8a69203f05953', h
          print('T3_SHA_PASS',h)
          PY
          test "$(sha256sum sindel/c05c/C05C_T3_PREFILL_R3C.py | awk '{print $1}')" = '0b6e906bf4066606992f9b562989569567f623715ffe62f9b9a91b59fab44971'

      - name: Build exact isolated original stores
        shell: bash
        run: |
          set -euo pipefail
          "$SINDEL_PY" -u sindel/c05c/C05C_T3_SHARED_STORE_ISOLATED_R4.py export-prefill
          "$SINDEL_PY" -u sindel/c05c/C05C_T3_SHARED_STORE_ISOLATED_R4.py export-decode
          "$SINDEL_PY" -u sindel/c05c/C05C_T3_SHARED_STORE_ISOLATED_R4.py merge-store

      - name: A02 prefill original qualified PTD
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v "$SINDEL_PY" -u sindel/c05c/C05C_T3_PTD_AB_DIAGNOSTIC_R5.py prefill-original

      - name: A02 prefill union PTD
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v "$SINDEL_PY" -u sindel/c05c/C05C_T3_PTD_AB_DIAGNOSTIC_R5.py prefill-union

      - name: A02 decode original PTD
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v "$SINDEL_PY" -u sindel/c05c/C05C_T3_PTD_AB_DIAGNOSTIC_R5.py decode-original

      - name: A02 decode union PTD
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v "$SINDEL_PY" -u sindel/c05c/C05C_T3_PTD_AB_DIAGNOSTIC_R5.py decode-union

      - name: A02 analyze and localize F01
        shell: bash
        run: |
          set -euo pipefail
          "$SINDEL_PY" -u sindel/c05c/C05C_T3_PTD_AB_DIAGNOSTIC_R5.py analyze | tee "$RUNNER_TEMP/c05c_a02_ptd_ab_r5/analyze_stdout.txt"
          test -s "$RUNNER_TEMP/c05c_a02_ptd_ab_r5/C05C_A02_PTD_AB_EVIDENCE_R5.json"

      - name: Preserve A02 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SINDEL_C05C_A02_PTD_AB_R5_EVIDENCE
          path: |
            ${{ runner.temp }}/c05c_a02_ptd_ab_r5/**
            ${{ runner.temp }}/c05c_shared_store_isolated_r4/01_export_prefill/stage_result.json
            ${{ runner.temp }}/c05c_shared_store_isolated_r4/01_export_prefill/source_outputs.npz
            ${{ runner.temp }}/c05c_shared_store_isolated_r4/02_export_decode/stage_result.json
            ${{ runner.temp }}/c05c_shared_store_isolated_r4/02_export_decode/source_outputs.npz
            ${{ runner.temp }}/c05c_shared_store_isolated_r4/03_merge_store/stage_result.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

      - name: Fail closed if A02 did not produce a classification
        shell: bash
        run: |
          set -euo pipefail
          "$SINDEL_PY" - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['SINDEL_C05C_A02_OUT'])/'c05c_a02_ptd_ab_r5'/'C05C_A02_PTD_AB_EVIDENCE_R5.json'
          d=json.loads(p.read_text())
          assert d['schema']=='sindel.cp034.c05c.a02-ptd-ab-r5.v1'
          assert d['classification']
          assert d['frozen_thresholds_unchanged']=={'cosine_min':0.9999,'mean_abs_max':0.005,'max_abs_max':0.05,'finite_required':True}
          assert len(d['raw_output_sha256'])==6
          print('A02_EVIDENCE_CAPTURE_PASS', d['status'], d['classification'])
          PY
