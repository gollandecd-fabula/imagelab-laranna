name: SINDEL C05C P1 Public Assets R4

on:
  push:
    branches: [sindel-c05b-wheelhouse-r3]
    paths:
      - '.github/workflows/sindel-c05c-p1-public-assets-r4.yml'

permissions:
  contents: read

jobs:
  stage-public-assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.15'

      - name: Acquire and verify exact public assets
        shell: bash
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/c05c_p1_r4"
          mkdir -p "$W/python" "$W/source" "$W/model" "$W/provenance" "$W/parts"

          python --version
          test "$(python -c 'import platform; print(platform.python_version())')" = '3.11.15'
          PY_PREFIX="$(python -c 'import sys; print(sys.prefix)')"
          tar -C "$PY_PREFIX" -czf "$W/python/C05C_PYTHON_31115_RUNTIME.tar.gz" .

          git clone --filter=blob:none --no-checkout https://github.com/resemble-ai/chatterbox.git "$W/source/repo"
          git -C "$W/source/repo" fetch --depth=1 origin 5de7a54aa4e5e2baadb0182dde554908b48b85c2
          git -C "$W/source/repo" checkout --detach 5de7a54aa4e5e2baadb0182dde554908b48b85c2
          test "$(git -C "$W/source/repo" rev-parse HEAD)" = '5de7a54aa4e5e2baadb0182dde554908b48b85c2'
          tar -C "$W/source/repo/src" -czf "$W/source/C05C_CHATTERBOX_SOURCE_5DE7A54_R4.tar.gz" chatterbox

          HF_REV=e2d6902dd4c1301892935d0a0277325551e8060e
          curl -L --fail --retry 5 --retry-delay 5 \
            "https://huggingface.co/ResembleAI/chatterbox/resolve/${HF_REV}/grapheme_mtl_merged_expanded_v1.json?download=true" \
            -o "$W/model/grapheme_mtl_merged_expanded_v1.json"
          test "$(sha256sum "$W/model/grapheme_mtl_merged_expanded_v1.json" | awk '{print $1}')" = 'df81a7ca7c31796cbe97f7a7142d5a53b12e88e12417ebe98f66602cafaf0461'

          curl -L --fail --retry 5 --retry-delay 10 \
            "https://huggingface.co/ResembleAI/chatterbox/resolve/${HF_REV}/t3_mtl23ls_v3.safetensors?download=true" \
            -o "$W/model/t3_mtl23ls_v3.safetensors"
          test "$(stat -c %s "$W/model/t3_mtl23ls_v3.safetensors")" = '2143989928'
          test "$(sha256sum "$W/model/t3_mtl23ls_v3.safetensors" | awk '{print $1}')" = '5abca8321ede76f8e61f1cc0d19aea6c946b28871017ce8726f8a69203f05953'

          split -b 300000000 -d -a 2 "$W/model/t3_mtl23ls_v3.safetensors" "$W/parts/t3_mtl23ls_v3.safetensors.part."
          test "$(find "$W/parts" -type f -name 't3_mtl23ls_v3.safetensors.part.*' | wc -l)" = '8'

          python - "$W" <<'PY'
          import hashlib, json, pathlib, platform, sys
          w=pathlib.Path(sys.argv[1])
          def sha(p):
              h=hashlib.sha256()
              with open(p,'rb') as f:
                  for b in iter(lambda:f.read(8*1024*1024),b''):
                      h.update(b)
              return h.hexdigest()
          parts=[]
          for p in sorted((w/'parts').glob('t3_mtl23ls_v3.safetensors.part.*')):
              parts.append({'name':p.name,'size_bytes':p.stat().st_size,'sha256':sha(p)})
          obj={
              'schema':'sindel.cp034.c05c.p1-public-assets.r4',
              'python_version':platform.python_version(),
              'chatterbox_commit':'5de7a54aa4e5e2baadb0182dde554908b48b85c2',
              'hf_revision':'e2d6902dd4c1301892935d0a0277325551e8060e',
              't3_size_bytes':(w/'model/t3_mtl23ls_v3.safetensors').stat().st_size,
              't3_sha256':sha(w/'model/t3_mtl23ls_v3.safetensors'),
              'tokenizer_sha256':sha(w/'model/grapheme_mtl_merged_expanded_v1.json'),
              'source_tar_sha256':sha(w/'source/C05C_CHATTERBOX_SOURCE_5DE7A54_R4.tar.gz'),
              'python_tar_sha256':sha(w/'python/C05C_PYTHON_31115_RUNTIME.tar.gz'),
              'model_parts':parts,
              'private_golden_included':False,
              'status':'PUBLIC_ASSETS_VERIFIED'
          }
          (w/'provenance/C05C_P1_PUBLIC_ASSETS_R4.json').write_text(json.dumps(obj,indent=2)+'\n')
          print(json.dumps(obj,indent=2))
          PY

      - name: Upload Python 3.11.15 runtime
        uses: actions/upload-artifact@v4
        with:
          name: C05C_PYTHON_31115_RUNTIME_R4
          path: ${{ runner.temp }}/c05c_p1_r4/python/C05C_PYTHON_31115_RUNTIME.tar.gz
          compression-level: 0
          retention-days: 2

      - name: Upload exact source and tokenizer
        uses: actions/upload-artifact@v4
        with:
          name: C05C_P1_SOURCE_TOKENIZER_R4
          path: |
            ${{ runner.temp }}/c05c_p1_r4/source/C05C_CHATTERBOX_SOURCE_5DE7A54_R4.tar.gz
            ${{ runner.temp }}/c05c_p1_r4/model/grapheme_mtl_merged_expanded_v1.json
          compression-level: 0
          retention-days: 2

      - name: Upload model part 00
        uses: actions/upload-artifact@v4
        with:
          name: C05C_T3_V3_R4_PART00
          path: ${{ runner.temp }}/c05c_p1_r4/parts/t3_mtl23ls_v3.safetensors.part.00
          compression-level: 0
          retention-days: 2
      - name: Upload model part 01
        uses: actions/upload-artifact@v4
        with:
          name: C05C_T3_V3_R4_PART01
          path: ${{ runner.temp }}/c05c_p1_r4/parts/t3_mtl23ls_v3.safetensors.part.01
          compression-level: 0
          retention-days: 2
      - name: Upload model part 02
        uses: actions/upload-artifact@v4
        with:
          name: C05C_T3_V3_R4_PART02
          path: ${{ runner.temp }}/c05c_p1_r4/parts/t3_mtl23ls_v3.safetensors.part.02
          compression-level: 0
          retention-days: 2
      - name: Upload model part 03
        uses: actions/upload-artifact@v4
        with:
          name: C05C_T3_V3_R4_PART03
          path: ${{ runner.temp }}/c05c_p1_r4/parts/t3_mtl23ls_v3.safetensors.part.03
          compression-level: 0
          retention-days: 2
      - name: Upload model part 04
        uses: actions/upload-artifact@v4
        with:
          name: C05C_T3_V3_R4_PART04
          path: ${{ runner.temp }}/c05c_p1_r4/parts/t3_mtl23ls_v3.safetensors.part.04
          compression-level: 0
          retention-days: 2
      - name: Upload model part 05
        uses: actions/upload-artifact@v4
        with:
          name: C05C_T3_V3_R4_PART05
          path: ${{ runner.temp }}/c05c_p1_r4/parts/t3_mtl23ls_v3.safetensors.part.05
          compression-level: 0
          retention-days: 2
      - name: Upload model part 06
        uses: actions/upload-artifact@v4
        with:
          name: C05C_T3_V3_R4_PART06
          path: ${{ runner.temp }}/c05c_p1_r4/parts/t3_mtl23ls_v3.safetensors.part.06
          compression-level: 0
          retention-days: 2
      - name: Upload model part 07
        uses: actions/upload-artifact@v4
        with:
          name: C05C_T3_V3_R4_PART07
          path: ${{ runner.temp }}/c05c_p1_r4/parts/t3_mtl23ls_v3.safetensors.part.07
          compression-level: 0
          retention-days: 2

      - name: Upload provenance
        uses: actions/upload-artifact@v4
        with:
          name: C05C_P1_PUBLIC_ASSETS_PROVENANCE_R4
          path: ${{ runner.temp }}/c05c_p1_r4/provenance/C05C_P1_PUBLIC_ASSETS_R4.json
          compression-level: 0
          retention-days: 2
