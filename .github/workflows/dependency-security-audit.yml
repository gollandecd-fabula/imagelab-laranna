name: ImageLab Dependency Security Audit

on:
  pull_request:
    branches:
      - bootstrap/zero-trust-gate
    paths:
      - recovery/source/requirements.txt
      - recovery/source/pyproject.toml
      - .github/workflows/dependency-security-audit.yml
  push:
    branches:
      - redteam/imagelab-complete-audit-20260725-v2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: imagelab-dependency-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: recovery/source
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13.14'
      - name: Require exact requirements pins
        run: |
          python - <<'PY'
          from pathlib import Path
          failures = []
          for number, raw in enumerate(Path('requirements.txt').read_text('utf-8').splitlines(), 1):
              line = raw.strip()
              if not line or line.startswith('#'):
                  continue
              if '==' not in line or any(token in line for token in ('>=', '<=', '~=', '!=', ' @ ')):
                  failures.append(f'line {number}: {line}')
          if failures:
              raise SystemExit('Unpinned requirements:\n' + '\n'.join(failures))
          PY
      - name: Install exact audit tool
        run: python -m pip install pip-audit==2.10.1
      - name: Audit pinned dependency set
        id: audit
        continue-on-error: true
        run: |
          python -m pip_audit --no-deps --requirement requirements.txt --format json --output dependency-audit.json
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: ImageLab-dependency-security-audit
          path: recovery/source/dependency-audit.json
          retention-days: 90
          if-no-files-found: error
      - name: Enforce fail-closed dependency verdict
        if: ${{ steps.audit.outcome != 'success' }}
        run: |
          echo 'Known dependency vulnerabilities or incomplete audit detected.'
          exit 1
