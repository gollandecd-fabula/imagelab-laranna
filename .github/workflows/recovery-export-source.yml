name: Recovery Export Source

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/recovery-export-source.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: bootstrap/zero-trust-gate

      - name: Verify imported base identity
        shell: bash
        run: |
          set -euo pipefail
          test -f recovery/source/app/config.py
          grep -F '1.4.2-zero-trust-candidate' recovery/source/app/config.py
          grep -F 'ZTR-M6-20260724-01' recovery/source/app/config.py
          test -f recovery/evidence/base-import.json
          python - <<'PY'
          import json
          from pathlib import Path
          evidence = json.loads(Path('recovery/evidence/base-import.json').read_text('utf-8'))
          assert evidence['status'] == 'PASS', evidence
          assert evidence['archive']['actual_sha256'] == 'c236656f53447996dc837a206a8896fc6abacf13d45829d8e9e64888b9f6b308'
          PY

      - name: Upload exact imported source tree
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: imagelab-recovery-source-base
          path: |
            recovery/source
            recovery/evidence/base-import.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
