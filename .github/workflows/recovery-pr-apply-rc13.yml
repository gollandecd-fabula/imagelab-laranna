name: Recovery PR Apply RC13

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/recovery-pr-apply-rc13.yml
      - recovery/patches/rc-13-ui-readiness-contract.patch.gz.b64
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: imagelab-recovery-rc13
  cancel-in-progress: false

env:
  EXACT_PYTHON_VERSION: '3.13.14'
  PATCH_BASE64_SHA256: '7f6b2d1d12ab9eeae627f48df790f5deb8a4ebdc1832846121487fdd47af22cd'
  PATCH_GZIP_SHA256: '064bac0be67da8fb2688b152200ac56553ddc0d459493d6def5dc0fe9a6d19da'
  PATCH_SHA256: 'f37b3757c40ba74f3b569869b0836a9b52f88040bb420de4bf9dd215ff37dccf'
  EXPECTED_SOURCE_SHA256: '83bcfcc9e9d6dfaa29ef2827f3a967d9719cbff2650672b7d5d9d3eac1af4885'
  EXPECTED_APP_VERSION: '1.4.9-recovery-candidate'
  EXPECTED_BUILD_ID: 'REC-RT8-M6-20260724-06'

jobs:
  apply-verify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout exact recovery branch
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: bootstrap/zero-trust-gate
          fetch-depth: 0

      - name: Set up exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ env.EXACT_PYTHON_VERSION }}

      - name: Verify and apply exact RC13 patch
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq "$EXPECTED_APP_VERSION" recovery/source/app/config.py && grep -Fq "$EXPECTED_BUILD_ID" recovery/source/app/config.py; then
            echo 'RC13 identity already applied.'
            exit 0
          fi
          payload='recovery/patches/rc-13-ui-readiness-contract.patch.gz.b64'
          echo "$PATCH_BASE64_SHA256  $payload" | sha256sum --check --strict
          base64 --decode "$payload" > "$RUNNER_TEMP/rc13.patch.gz"
          echo "$PATCH_GZIP_SHA256  $RUNNER_TEMP/rc13.patch.gz" | sha256sum --check --strict
          gzip -dc "$RUNNER_TEMP/rc13.patch.gz" > "$RUNNER_TEMP/rc13.patch"
          echo "$PATCH_SHA256  $RUNNER_TEMP/rc13.patch" | sha256sum --check --strict
          git apply --check --directory=recovery/source "$RUNNER_TEMP/rc13.patch"
          git apply --directory=recovery/source "$RUNNER_TEMP/rc13.patch"
          grep -F "$EXPECTED_APP_VERSION" recovery/source/app/config.py
          grep -F "$EXPECTED_BUILD_ID" recovery/source/app/config.py

      - name: Install exact source and test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --requirement recovery/source/requirements.txt pytest==9.0.2 httpx==0.28.1

      - name: Run exact 146-test regression
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/recovery/source
          IMAGELAB_DATA_DIR: ${{ runner.temp }}/imagelab-rc13-regression-data
        run: |
          set -euo pipefail
          cd recovery/source
          python -m compileall -q app release_gate scripts tests
          node --check app/static/app.js
          python -m pytest -q --junitxml="$RUNNER_TEMP/pytest-rc13.xml" | tee "$RUNNER_TEMP/pytest-rc13.log"
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          root = ET.parse(Path(os.environ['RUNNER_TEMP']) / 'pytest-rc13.xml').getroot()
          suites = [root] if root.tag == 'testsuite' else list(root.findall('testsuite'))
          values = tuple(sum(int(s.attrib.get(key, '0')) for s in suites) for key in ('tests','failures','errors','skipped'))
          assert values == (146, 0, 0, 0), values
          print('PYTEST_146_OF_146_PASS')
          PY

      - name: Run exact 26-file Source Gate
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/recovery/source
          IMAGELAB_DATA_DIR: ${{ runner.temp }}/imagelab-rc13-source-gate-data
        run: |
          set -euo pipefail
          mkdir -p recovery/evidence
          python recovery/source/release_gate/source_gate.py --output recovery/evidence/source-gate-recovery-1.4.9.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('recovery/evidence/source-gate-recovery-1.4.9.json').read_text('utf-8'))
          assert result['status'] == 'PASS', result
          assert result['identity'] == {'version':'1.4.9-recovery-candidate','build_id':'REC-RT8-M6-20260724-06'}
          critical = result['checks']['critical_pytest']
          assert critical['exit_code'] == 0 and len(critical['files']) == 26
          assert all(item['exit_code'] == 0 for item in critical['files'].values())
          assert result['checks']['javascript']['exit_code'] == 0
          assert result['backend_selftest']['status'] == 'PASS'
          print('SOURCE_GATE_26_OF_26_PASS')
          PY

      - name: Build deterministic 1.4.9 source ZIP twice
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib,json,stat,zipfile
          from pathlib import Path
          root=Path('recovery/source'); dist=Path('recovery/dist'); dist.mkdir(parents=True,exist_ok=True)
          deny={'.git','__pycache__','.pytest_cache','data','runtime-data','user-data'}
          files=[]
          for source in root.rglob('*'):
              if source.is_file():
                  rel=source.relative_to(root)
                  if not(set(rel.parts)&deny) and source.suffix not in {'.pyc','.pyo'}: files.append((rel.as_posix(),source))
          files.sort(key=lambda x:x[0])
          def build(path):
              with zipfile.ZipFile(path,'w') as archive:
                  for rel,source in files:
                      info=zipfile.ZipInfo(rel,(2026,7,24,0,0,0)); info.create_system=3; info.external_attr=(stat.S_IFREG|0o644)<<16; info.compress_type=zipfile.ZIP_DEFLATED
                      archive.writestr(info,source.read_bytes(),compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          a=dist/'rc13-a.zip'; b=dist/'rc13-b.zip'; build(a); build(b); payload=a.read_bytes(); assert payload==b.read_bytes()
          source_sha=hashlib.sha256(payload).hexdigest(); assert source_sha=='83bcfcc9e9d6dfaa29ef2827f3a967d9719cbff2650672b7d5d9d3eac1af4885',source_sha
          members_sha=hashlib.sha256('\n'.join(rel for rel,_ in files).encode()).hexdigest(); assert len(files)==87; assert members_sha=='b0c43a785c437bf649750a5541386b81b6436c160aad07a5aa6903265581e2fe'
          final=dist/'ImageLab_by_LarannA_RECOVERY_1.4.9_SOURCE.zip'; final.write_bytes(payload); a.unlink(); b.unlink()
          manifest={'schema':1,'status':'PASS','identity':{'version':'1.4.9-recovery-candidate','build_id':'REC-RT8-M6-20260724-06'},'file':final.name,'sha256':source_sha,'size_bytes':len(payload),'member_count':len(files),'members_sha256':members_sha,'reproducible_builds':2,'builds_byte_identical':True}
          (dist/'source-manifest-1.4.9.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n','utf-8')
          print(json.dumps(manifest,ensure_ascii=False,indent=2))
          PY

      - name: Write exact RC13 evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('recovery/dist/source-manifest-1.4.9.json').read_text('utf-8'))
          source_gate=json.loads(Path('recovery/evidence/source-gate-recovery-1.4.9.json').read_text('utf-8'))
          evidence={'schema':1,'status':'PASS_SOURCE_RECOVERY_INCREMENT','identity':manifest['identity'],'parent':{'version':'1.4.8-recovery-candidate','build_id':'REC-RT8-M6-20260724-05','source_sha256':'fa5809e797c57164bc0eed8b111902731d2dad0a903f142cfcf95a378474ca17'},'patch_sha256':'f37b3757c40ba74f3b569869b0836a9b52f88040bb420de4bf9dd215ff37dccf','recovered_cluster':{'id':'RC-13','name':'UI readiness validates visible version/install and build title contract','status':'PASS'},'checks':{'full_pytest':'146/146 PASS','required_test_files':'26/26 PASS','compileall':'PASS','javascript_syntax':'PASS','backend_selftest':source_gate['backend_selftest']['status'],'source_zip_reproducibility':'2/2 BYTE_IDENTICAL'},'source_bundle':manifest,'claim_boundary':{'source_recovery_increment':'PASS','windows_clean_install':'NOT_YET_REPEATED_FOR_1.4.9','windows_independent_rerun':'NOT_YET_REPEATED_FOR_1.4.9','update_rollback':'UNVERIFIED','physical_user_path_L5':'UNVERIFIED','release':'BLOCKED'}}
          Path('recovery/evidence/recovery-increment-1.4.9.json').write_text(json.dumps(evidence,ensure_ascii=False,indent=2)+'\n','utf-8')
          print(json.dumps(evidence,ensure_ascii=False,indent=2))
          PY

      - name: Commit verified RC13 source and bundle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ImageLab Recovery Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add recovery/source recovery/evidence/recovery-increment-1.4.9.json recovery/evidence/source-gate-recovery-1.4.9* recovery/dist/ImageLab_by_LarannA_RECOVERY_1.4.9_SOURCE.zip recovery/dist/source-manifest-1.4.9.json
          if git diff --cached --quiet; then echo 'Verified RC13 output already committed.'; exit 0; fi
          git commit -m 'recovery: align UI readiness with displayed identity [recovery-rc13-output]'
          for attempt in 1 2 3; do
            if git push origin HEAD:bootstrap/zero-trust-gate; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            git fetch origin bootstrap/zero-trust-gate
            git rebase origin/bootstrap/zero-trust-gate
          done

      - name: Upload RC13 evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: imagelab-recovery-1.4.9-rc13
          path: |
            recovery/evidence/recovery-increment-1.4.9.json
            recovery/evidence/source-gate-recovery-1.4.9.json
            recovery/evidence/source-gate-recovery-1.4.9.progress.log
            recovery/dist/ImageLab_by_LarannA_RECOVERY_1.4.9_SOURCE.zip
            recovery/dist/source-manifest-1.4.9.json
            ${{ runner.temp }}/pytest-rc13.log
            ${{ runner.temp }}/pytest-rc13.xml
          if-no-files-found: warn
          retention-days: 30
