name: ImageLab M2A UI Completeness CI

on:
  push:
    branches: [redteam/imagelab-complete-audit-20260725-v2]
    paths:
      - recovery/source/app/entry.py
      - recovery/source/app/m2a_api.py
      - recovery/source/app/models.py
      - recovery/source/app/services/m2a_processing.py
      - recovery/source/app/services/vector_fidelity.py
      - recovery/source/app/services/repair_service.py
      - recovery/source/app/services/__init__.py
      - recovery/source/app/static/m2a-ui.css
      - recovery/source/app/static/m2a-completeness.css
      - recovery/source/app/static/m2a-ui-parts/**
      - recovery/source/tests/test_m2a_ui.py
      - recovery/source/tests/test_geometry_m2a.py
      - recovery/source/tests/test_m2b_vector.py
      - recovery/source/tests/test_browser_m2a.py
      - recovery/source/tests/test_m2a_workspace.py
      - recovery/source/tests/test_browser_m2a_matrix.py
      - recovery/source/tests/test_m2a_closure.py
      - recovery/source/tests/test_browser_m2a_closure.py
      - recovery/source/tests/test_browser_m2a_rtm_evidence.py
      - recovery/source/tests/test_browser_m2a_prj_closure.py
      - recovery/source/docs/M2A_EXECUTION_RTM_V1_2.md
      - recovery/source/docs/v1_4_4/**
      - .github/workflows/m2a-ui-completeness-ci.yml
      - .github/workflows/full-audit-source-snapshot.yml
      - .github/workflows/workflow-governance-ci.yml
      - .github/workflows/bootstrap-verifier-contract.yml
      - .github/workflows/dependency-security-audit.yml
      - .github/workflows/codex-evidence-hardening-ci.yml
  pull_request:
    branches: [bootstrap/zero-trust-gate]
    paths:
      - recovery/source/app/entry.py
      - recovery/source/app/m2a_api.py
      - recovery/source/app/models.py
      - recovery/source/app/services/m2a_processing.py
      - recovery/source/app/services/vector_fidelity.py
      - recovery/source/app/services/repair_service.py
      - recovery/source/app/services/__init__.py
      - recovery/source/app/static/m2a-ui.css
      - recovery/source/app/static/m2a-completeness.css
      - recovery/source/app/static/m2a-ui-parts/**
      - recovery/source/tests/test_m2a_ui.py
      - recovery/source/tests/test_geometry_m2a.py
      - recovery/source/tests/test_m2b_vector.py
      - recovery/source/tests/test_browser_m2a.py
      - recovery/source/tests/test_m2a_workspace.py
      - recovery/source/tests/test_browser_m2a_matrix.py
      - recovery/source/tests/test_m2a_closure.py
      - recovery/source/tests/test_browser_m2a_closure.py
      - recovery/source/tests/test_browser_m2a_rtm_evidence.py
      - recovery/source/tests/test_browser_m2a_prj_closure.py
      - recovery/source/docs/M2A_EXECUTION_RTM_V1_2.md
      - recovery/source/docs/v1_4_4/**
      - .github/workflows/m2a-ui-completeness-ci.yml
      - .github/workflows/full-audit-source-snapshot.yml
      - .github/workflows/workflow-governance-ci.yml
      - .github/workflows/bootstrap-verifier-contract.yml
      - .github/workflows/dependency-security-audit.yml
      - .github/workflows/codex-evidence-hardening-ci.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: imagelab-m2a-ui-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  M1_BASELINE_SHA: 35dd66bca9b31f2e9c098063a5382cd4f1c09cd6

jobs:
  scope-guard:
    name: M2A/M2B protocol and diff scope
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
      - name: Require M1 baseline ancestry
        run: git merge-base --is-ancestor "$M1_BASELINE_SHA" HEAD
      - name: Enforce approved M2A/M2B changed paths
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(\.github/workflows/(m2a-ui-completeness-ci|full-audit-source-snapshot|workflow-governance-ci|bootstrap-verifier-contract|dependency-security-audit|codex-evidence-hardening-ci)\.yml|recovery/source/docs/M2A_EXECUTION_RTM_V1_2\.md|recovery/source/docs/v1_4_4/.*|recovery/source/app/(entry|m2a_api|models)\.py|recovery/source/app/services/(__init__|m2a_processing|vector_fidelity|repair_service)\.py|recovery/source/app/static/(m2a-ui\.css|m2a-completeness\.css)|recovery/source/app/static/m2a-ui-parts/.*|recovery/source/tests/test_(m2a_ui|geometry_m2a|m2b_vector|browser_m2a|m2a_workspace|browser_m2a_matrix|m2a_closure|browser_m2a_closure|browser_m2a_rtm_evidence|browser_m2a_prj_closure)\.py)$'
          git diff --name-only "$M1_BASELINE_SHA"...HEAD > /tmp/m2a-files.txt
          cat /tmp/m2a-files.txt
          while IFS= read -r path; do
            [[ "$path" =~ $allowed ]] || { echo "Out-of-scope M2A/M2B change: $path"; exit 1; }
          done < /tmp/m2a-files.txt
      - name: Enforce prohibited surfaces and claims
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RniE 'text[- ]to[- ]image|blank[- ]canvas|M2A_COMPLETE|GENESIS_RELEASE_AUTHORIZED' \
            recovery/source/app/m2a_api.py recovery/source/app/static/m2a-ui-parts recovery/source/docs/M2A_EXECUTION_RTM_V1_2.md
          grep -q 'M2B NOT STARTED' recovery/source/app/static/m2a-ui-parts/07-scope-lock.js.part
          grep -q "'masterCardButton'" recovery/source/app/static/m2a-ui-parts/07-scope-lock.js.part
          grep -q "node.value = ''" recovery/source/app/static/m2a-ui-parts/07-scope-lock.js.part
      - name: Prove release chain is unchanged from M1
        shell: bash
        run: |
          set -euo pipefail
          ! git diff --name-only "$M1_BASELINE_SHA"...HEAD | grep -E '(^|/)(release_gate|windows_installer)/|zero-trust-(release|genesis)'

  python-contracts:
    name: M2A API, geometry and full source suite
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: recovery/source
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with: {python-version: '3.13.14'}
      - name: Install exact dependencies
        run: |
          python -m pip install -q --requirement requirements.txt
          python -m pip install -q pytest==8.4.2 httpx==0.28.1
      - name: Compile M2A/M2B Python surface
        run: python -m compileall -q app/entry.py app/m2a_api.py app/services/m2a_processing.py app/services/vector_fidelity.py app/services/repair_service.py tests/test_m2a_ui.py tests/test_geometry_m2a.py tests/test_m2b_vector.py tests/test_m2a_workspace.py tests/test_m2a_closure.py tests/test_browser_m2a_closure.py tests/test_browser_m2a_prj_closure.py
      - name: Validate concatenated JavaScript syntax
        run: |
          cat app/static/m2a-ui-parts/*.js.part > /tmp/m2a-ui.js
          node --check /tmp/m2a-ui.js
      - name: Run focused M2A/M2B contracts
        run: python -m pytest tests/test_m2a_ui.py tests/test_geometry_m2a.py tests/test_m2b_vector.py tests/test_m2a_workspace.py tests/test_m2a_closure.py -vv --tb=short
      - name: Run complete source suite
        run: |
          python -m pytest -q > m2a-full-suite.log 2>&1
          code=$?
          tail -n 180 m2a-full-suite.log
          exit $code
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: ImageLab-M2A-python-evidence
          path: recovery/source/m2a-full-suite.log
          retention-days: 30
          if-no-files-found: warn

  browser-visual:
    name: M2A Chromium interaction and screenshot matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: recovery/source
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with: {python-version: '3.13.14'}
      - name: Install exact browser dependencies
        run: |
          python -m pip install -q --requirement requirements.txt
          python -m pip install -q pytest==8.4.2 httpx==0.28.1 playwright==1.60.0
          python -m playwright install --with-deps chromium
      - name: Run real-browser contracts and build screenshots
        env: {M2A_ARTIFACT_DIR: artifacts/m2a-visual}
        run: python -m pytest tests/test_browser_m1.py tests/test_browser_m2a.py tests/test_browser_m2a_matrix.py tests/test_browser_m2a_closure.py tests/test_browser_m2a_rtm_evidence.py tests/test_browser_m2a_prj_closure.py -vv --tb=short
      - name: Validate required visual matrix
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          root=Path('artifacts/m2a-visual')
          failures=[]
          for width in (800,1024,1280,1440,1920):
              path=root/f'm2a-{width}.png'
              if not path.is_file(): failures.append(f'missing {path.name}'); continue
              with Image.open(path) as image:
                  if image.width != width: failures.append(f'{path.name}: width {image.width}')
                  if image.height < 700: failures.append(f'{path.name}: height {image.height}')
          if failures: raise SystemExit('\n'.join(failures))
          PY
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: ImageLab-M2A-visual-matrix
          path: recovery/source/artifacts/m2a-visual/
          retention-days: 30
          if-no-files-found: error
