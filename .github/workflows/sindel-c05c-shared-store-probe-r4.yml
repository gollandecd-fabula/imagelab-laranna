name: SINDEL C05C Shared T3 Store Probe R4

on:
  push:
    branches: [sindel-c05b-wheelhouse-r3]
    paths:
      - 'sindel/c05c/C05C_T3_SHARED_STORE_PROBE_R4.py'
      - 'sindel/c05c/C05C_T3_PREFILL_EXTERNAL_GATE_R4.json'
      - '.github/workflows/sindel-c05c-shared-store-probe-r4.yml'

permissions:
  contents: read
  actions: read

jobs:
  shared-store-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.15'
          check-latest: false

      - name: Restore exact frozen export environment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/C05C_EXPORT_ENV_R3"
          mkdir -p "$E"
          gh run download 35055036918 -R "$GITHUB_REPOSITORY" -n C05C_EXPORT_ENV_R3 -D "$E"
          LOCK=$(find "$E" -name C05C_EXPORT_ENV_LOCK_R3.json -print -quit)
          test -n "$LOCK"
          BASE=$(dirname "$LOCK")
          test "$(sha256sum "$BASE/C05C_EXPORT_ENV_LOCK_R3.json" | awk '{print $1}')" = '05ab0315a31ad48ef36b834b2305ea3c59dabe13ed104beb752d65686b7449d2'
          test "$(sha256sum "$BASE/requirements.offline.freeze.txt" | awk '{print $1}')" = '52d2ac268b1defd446e6778c612c2de6b3a889165e0cd0737f927d264e6797b5'
          (cd "$BASE" && sha256sum -c SHA256SUMS.txt)
          python -m venv "$RUNNER_TEMP/c05c_exact_env"
          "$RUNNER_TEMP/c05c_exact_env/bin/python" -m pip install --disable-pip-version-check --no-input --no-index --find-links "$BASE/wheelhouse" -r "$BASE/requirements.offline.freeze.txt"
          "$RUNNER_TEMP/c05c_exact_env/bin/python" -m pip freeze | LC_ALL=C sort > "$RUNNER_TEMP/freeze.txt"
          cmp -s "$RUNNER_TEMP/freeze.txt" "$BASE/requirements.offline.freeze.txt"
          echo "SINDEL_PY=$RUNNER_TEMP/c05c_exact_env/bin/python" >> "$GITHUB_ENV"

      - name: Prepare frozen source and exact T3 V3
        shell: bash
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/sindel_c05c_work"
          mkdir -p "$W/source" "$W/model"
          git clone --quiet https://github.com/resemble-ai/chatterbox.git "$RUNNER_TEMP/chatterbox"
          git -C "$RUNNER_TEMP/chatterbox" checkout --quiet 5de7a54aa4e5e2baadb0182dde554908b48b85c2
          test "$(git -C "$RUNNER_TEMP/chatterbox" rev-parse HEAD)" = '5de7a54aa4e5e2baadb0182dde554908b48b85c2'
          cp -a "$RUNNER_TEMP/chatterbox/src/chatterbox" "$W/source/"
          "$SINDEL_PY" - <<'PY'
          from huggingface_hub import hf_hub_download
          from pathlib import Path
          import hashlib, shutil, os
          W=Path(os.environ['RUNNER_TEMP'])/'sindel_c05c_work'
          src=Path(hf_hub_download(repo_id='ResembleAI/chatterbox', filename='t3_mtl23ls_v3.safetensors'))
          dst=W/'model/t3_mtl23ls_v3.safetensors'; shutil.copy2(src,dst)
          h=hashlib.sha256(dst.read_bytes()).hexdigest()
          assert h=='5abca8321ede76f8e61f1cc0d19aea6c946b28871017ce8726f8a69203f05953', h
          print('T3_SHA_PASS',h)
          PY
          test "$(sha256sum sindel/c05c/C05C_T3_PREFILL_R3C.py | awk '{print $1}')" = '0b6e906bf4066606992f9b562989569567f623715ffe62f9b9a91b59fab44971'

      - name: Run shared prefill decode external-store probe
        shell: bash
        run: |
          set -euo pipefail
          export SINDEL_C05C_WORK="$RUNNER_TEMP/sindel_c05c_work"
          export SINDEL_C05C_SHARED_OUT="$RUNNER_TEMP"
          export OMP_NUM_THREADS=4 MKL_NUM_THREADS=4 OPENBLAS_NUM_THREADS=4
          export PATH="$(dirname "$SINDEL_PY"):$PATH"
          "$SINDEL_PY" -u sindel/c05c/C05C_T3_SHARED_STORE_PROBE_R4.py
          D="$RUNNER_TEMP/c05c_shared_store_r4"
          test -s "$D/C05C_T3_SHARED_STORE_PROBE_R4.json"
          test -s "$D/t3_prefill_shared_probe_r4.pte"
          test -s "$D/t3_decode_shared_probe_r4.pte"
          test -s "$D/t3_shared_from_prefill.ptd"
          test -s "$D/t3_shared_from_decode.ptd"
          cmp -s "$D/t3_shared_from_prefill.ptd" "$D/t3_shared_from_decode.ptd"
          "$SINDEL_PY" - <<'PY'
          import json, os
          from pathlib import Path
          d=Path(os.environ['RUNNER_TEMP'])/'c05c_shared_store_r4'
          r=json.loads((d/'C05C_T3_SHARED_STORE_PROBE_R4.json').read_text())
          assert r['status']=='PASS_L2', r
          assert r['store']['byte_identical_from_both_programs'] is True
          assert r['runtime']['same_ptd_bytes_used_for_both'] is True
          assert r['runtime']['prefill_real_forward'] is True
          assert r['runtime']['decode_real_forward'] is True
          print('SHARED_STORE_GATE_PASS')
          PY
          rm "$D/t3_shared_from_decode.ptd"
          split -b 225M -d -a 2 "$D/t3_shared_from_prefill.ptd" "$D/t3_shared.ptd.part."
          test "$(find "$D" -maxdepth 1 -type f -name 't3_shared.ptd.part.*' | wc -l)" -eq 5
          sha256sum "$D"/t3_shared.ptd.part.* > "$D/PTD_PART_SHA256SUMS.txt"
          sha256sum "$D/t3_shared_from_prefill.ptd" "$D/t3_prefill_shared_probe_r4.pte" "$D/t3_decode_shared_probe_r4.pte" "$D/C05C_T3_SHARED_STORE_PROBE_R4.json" > "$D/SHA256SUMS.txt"

      - name: Upload probe evidence and PTEs
        uses: actions/upload-artifact@v4
        with:
          name: SINDEL_C05C_T3_SHARED_STORE_R4_META
          path: |
            ${{ runner.temp }}/c05c_shared_store_r4/C05C_T3_SHARED_STORE_PROBE_R4.json
            ${{ runner.temp }}/c05c_shared_store_r4/t3_prefill_shared_probe_r4.pte
            ${{ runner.temp }}/c05c_shared_store_r4/t3_decode_shared_probe_r4.pte
            ${{ runner.temp }}/c05c_shared_store_r4/SHA256SUMS.txt
            ${{ runner.temp }}/c05c_shared_store_r4/PTD_PART_SHA256SUMS.txt
          compression-level: 0
          retention-days: 7

      - name: Upload shared PTD part 00
        uses: actions/upload-artifact@v4
        with: {name: SINDEL_C05C_T3_SHARED_UNION_R4_PART00, path: '${{ runner.temp }}/c05c_shared_store_r4/t3_shared.ptd.part.00', compression-level: 0, retention-days: 7}
      - name: Upload shared PTD part 01
        uses: actions/upload-artifact@v4
        with: {name: SINDEL_C05C_T3_SHARED_UNION_R4_PART01, path: '${{ runner.temp }}/c05c_shared_store_r4/t3_shared.ptd.part.01', compression-level: 0, retention-days: 7}
      - name: Upload shared PTD part 02
        uses: actions/upload-artifact@v4
        with: {name: SINDEL_C05C_T3_SHARED_UNION_R4_PART02, path: '${{ runner.temp }}/c05c_shared_store_r4/t3_shared.ptd.part.02', compression-level: 0, retention-days: 7}
      - name: Upload shared PTD part 03
        uses: actions/upload-artifact@v4
        with: {name: SINDEL_C05C_T3_SHARED_UNION_R4_PART03, path: '${{ runner.temp }}/c05c_shared_store_r4/t3_shared.ptd.part.03', compression-level: 0, retention-days: 7}
      - name: Upload shared PTD part 04
        uses: actions/upload-artifact@v4
        with: {name: SINDEL_C05C_T3_SHARED_UNION_R4_PART04, path: '${{ runner.temp }}/c05c_shared_store_r4/t3_shared.ptd.part.04', compression-level: 0, retention-days: 7}
