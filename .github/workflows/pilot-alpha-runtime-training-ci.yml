name: ImageLab Pilot Alpha Runtime Training Lock

on:
  pull_request:
    branches: [redteam/imagelab-complete-audit-20260725-v2]
    paths:
      - recovery/source/app/**
      - recovery/source/tests/runtime_training_lock_probe.py
      - recovery/source/requirements.txt
      - .github/workflows/pilot-alpha-runtime-training-ci.yml
  push:
    branches: [pilot/controlled-vertical-alpha-v1-3-1]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: imagelab-pilot-runtime-training-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runtime-training-lock:
    name: Real runtime train rollback fail-close and no-write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: recovery/source
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind exact Pilot candidate SHA
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          require_exact() { test "$1" = "$2"; }
          require_exact "$actual" "$expected" || { echo "::error::candidate mismatch actual=$actual expected=$expected"; exit 1; }
          mismatch="${expected%?}0"
          test "$mismatch" != "$expected" || mismatch="${expected%?}1"
          if require_exact "$actual" "$mismatch"; then
            echo "::error::mismatched-SHA negative fixture was accepted"
            exit 1
          fi
          printf 'exact_candidate_sha=%s\n' "$actual"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13.14'
      - name: Install exact source dependencies
        run: python -m pip install -q --requirement requirements.txt
      - name: Enforce real-runtime probe boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'uvicorn' tests/runtime_training_lock_probe.py
          grep -q 'http.client' tests/runtime_training_lock_probe.py
          ! grep -nE 'TestClient|monkeypatch|unittest\.mock|from mock|import mock' tests/runtime_training_lock_probe.py
      - name: Probe runtime training lock
        env:
          PILOT_EVIDENCE_DIR: artifacts/pilot-runtime-training
          PILOT_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python tests/runtime_training_lock_probe.py
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: ImageLab-Runtime-Training-Lock-${{ github.event.pull_request.head.sha || github.sha }}
          path: recovery/source/artifacts/pilot-runtime-training/
          retention-days: 30
          if-no-files-found: error
