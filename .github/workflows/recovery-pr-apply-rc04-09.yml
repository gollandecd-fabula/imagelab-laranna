name: Recovery PR Apply RC04-09

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/recovery-pr-apply-rc04-09.yml
      - recovery/patches/rc-04-09/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: imagelab-recovery-rc04-09
  cancel-in-progress: false

jobs:
  apply-verify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact recovery branch
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: bootstrap/zero-trust-gate
          fetch-depth: 0

      - name: Set up exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13.14'

      - name: Admit and apply exact RC04-09 patch at source root
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq '1.4.5-recovery-candidate' recovery/source/app/config.py && \
             grep -Fq 'REC-RT8-M6-20260724-02' recovery/source/app/config.py; then
            echo 'RC04-09 source identity is already present.'
            exit 0
          fi
          python - <<'PY'
          from __future__ import annotations
          import base64
          import gzip
          import hashlib
          import subprocess
          from pathlib import Path

          part_names = [f'part-{index:02d}.b64' for index in range(8)]
          root = Path('recovery/patches/rc-04-09')
          combined = b''.join((root / name).read_bytes() for name in part_names)
          assert hashlib.sha256(combined).hexdigest() == '499aab619bb6d1bd6cac8b3a9cf656197f6dd7006fd91627c92f4e434b70fee8'
          gzip_bytes = base64.b64decode(combined, validate=True)
          assert hashlib.sha256(gzip_bytes).hexdigest() == '4101fedd2609e0574c4028dca228588c42bd53e0d92fa1c348d271745253249a'
          patch_bytes = gzip.decompress(gzip_bytes)
          assert hashlib.sha256(patch_bytes).hexdigest() == '137640abe5810913c8870bec55a10284e1b7bf2589db84366a7c3d3ce451397d'
          patch = Path('/tmp/rc04-09.patch')
          patch.write_bytes(patch_bytes)
          subprocess.run(
              ['git', 'apply', '--check', '--directory=recovery/source', str(patch)],
              check=True,
          )
          subprocess.run(
              ['git', 'apply', '--directory=recovery/source', str(patch)],
              check=True,
          )
          PY
          grep -F '1.4.5-recovery-candidate' recovery/source/app/config.py
          grep -F 'REC-RT8-M6-20260724-02' recovery/source/app/config.py

      - name: Install exact source and test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            -r recovery/source/requirements.txt \
            pytest==9.0.2 \
            httpx==0.28.1

      - name: Run full 142-test regression
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/recovery/source
          IMAGELAB_DATA_DIR: ${{ runner.temp }}/imagelab-regression-data
        run: |
          set -euo pipefail
          cd recovery/source
          python -m compileall -q app release_gate scripts tests
          node --check app/static/app.js
          python -m pytest -q | tee "$RUNNER_TEMP/pytest-full.log"
          grep -Eq '142 passed' "$RUNNER_TEMP/pytest-full.log"

      - name: Run exact 26-file Source Gate
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/recovery/source
          IMAGELAB_DATA_DIR: ${{ runner.temp }}/imagelab-source-gate-data
        run: |
          set -euo pipefail
          mkdir -p recovery/evidence
          python recovery/source/release_gate/source_gate.py \
            --output recovery/evidence/source-gate-recovery.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('recovery/evidence/source-gate-recovery.json').read_text('utf-8'))
          assert result['status'] == 'PASS', result
          assert result['identity'] == {
              'version': '1.4.5-recovery-candidate',
              'build_id': 'REC-RT8-M6-20260724-02',
          }
          critical = result['checks']['critical_pytest']
          assert critical['exit_code'] == 0
          assert len(critical['files']) == 26
          assert all(item['exit_code'] == 0 for item in critical['files'].values())
          assert result['checks']['javascript']['exit_code'] == 0
          assert result['backend_selftest']['status'] == 'PASS'
          print('SOURCE_GATE_26_OF_26_PASS')
          PY

      - name: Build deterministic source ZIP twice and write evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import stat
          import zipfile
          from pathlib import Path

          root = Path('recovery/source')
          dist = Path('recovery/dist')
          evidence_dir = Path('recovery/evidence')
          dist.mkdir(parents=True, exist_ok=True)
          evidence_dir.mkdir(parents=True, exist_ok=True)
          deny = {'.git', '__pycache__', '.pytest_cache', 'data', 'runtime-data', 'user-data'}
          files = []
          for source in root.rglob('*'):
              if not source.is_file():
                  continue
              rel = source.relative_to(root)
              if set(rel.parts).intersection(deny) or source.suffix == '.pyc':
                  continue
              files.append((rel.as_posix(), source))
          files.sort(key=lambda item: item[0])

          def build(path: Path) -> None:
              with zipfile.ZipFile(path, 'w') as archive:
                  for rel, source in files:
                      info = zipfile.ZipInfo(rel, date_time=(2026, 7, 24, 0, 0, 0))
                      info.create_system = 3
                      info.external_attr = (stat.S_IFREG | 0o644) << 16
                      info.compress_type = zipfile.ZIP_DEFLATED
                      archive.writestr(
                          info,
                          source.read_bytes(),
                          compress_type=zipfile.ZIP_DEFLATED,
                          compresslevel=9,
                      )

          first = dist / 'source-a.zip'
          second = dist / 'source-b.zip'
          build(first)
          build(second)
          first_bytes = first.read_bytes()
          assert first_bytes == second.read_bytes(), 'source ZIP builds differ'
          source_sha = hashlib.sha256(first_bytes).hexdigest()
          assert source_sha == 'e4268157d6abc5495eefa9799b09a5352d43102019c4f0047f7303597f6c2ea7'
          members_sha = hashlib.sha256('\n'.join(rel for rel, _ in files).encode('utf-8')).hexdigest()
          assert len(files) == 87
          assert members_sha == 'b0c43a785c437bf649750a5541386b81b6436c160aad07a5aa6903265581e2fe'
          final_zip = dist / 'ImageLab_by_LarannA_RECOVERY_1.4.5_SOURCE.zip'
          final_zip.write_bytes(first_bytes)
          first.unlink()
          second.unlink()
          manifest = {
              'schema': 1,
              'status': 'PASS',
              'identity': {
                  'version': '1.4.5-recovery-candidate',
                  'build_id': 'REC-RT8-M6-20260724-02',
              },
              'file': final_zip.name,
              'sha256': source_sha,
              'size_bytes': len(first_bytes),
              'member_count': len(files),
              'members_sha256': members_sha,
              'reproducible_builds': 2,
              'builds_byte_identical': True,
          }
          (dist / 'source-manifest.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', 'utf-8'
          )
          source_gate = json.loads((evidence_dir / 'source-gate-recovery.json').read_text('utf-8'))
          complete = {
              'schema': 1,
              'status': 'PASS_SOURCE_RECOVERY_COMPLETE',
              'identity': manifest['identity'],
              'base': {
                  'version': '1.4.2-zero-trust-candidate',
                  'build_id': 'ZTR-M6-20260724-01',
                  'archive_sha256': 'c236656f53447996dc837a206a8896fc6abacf13d45829d8e9e64888b9f6b308',
              },
              'patches': {
                  'rc01_03_sha256': '674ff435d98487a99efde0b4a5081bb0acc311fde9f0a1a42e908b5011b951b5',
                  'rc04_09_sha256': '137640abe5810913c8870bec55a10284e1b7bf2589db84366a7c3d3ce451397d',
              },
              'checks': {
                  'full_pytest': '142/142 PASS',
                  'required_test_files': '26/26 PASS',
                  'compileall': 'PASS',
                  'javascript_syntax': 'PASS',
                  'backend_selftest': source_gate['backend_selftest']['status'],
                  'source_zip_reproducibility': '2/2 BYTE_IDENTICAL',
              },
              'source_bundle': manifest,
              'recovered_clusters': [f'RC-{index:02d}' for index in range(1, 10)],
              'claim_boundary': {
                  'source_recovery': 'PASS',
                  'windows_packaging': 'NOT_STARTED_FOR_RECOVERY_CANDIDATE',
                  'installed_windows_runtime_L4': 'UNVERIFIED',
                  'physical_user_path_L5': 'UNVERIFIED',
                  'update_rollback': 'UNVERIFIED',
                  'release': 'BLOCKED',
              },
          }
          (evidence_dir / 'recovery-complete.json').write_text(
              json.dumps(complete, ensure_ascii=False, indent=2) + '\n', 'utf-8'
          )
          print(json.dumps(complete, ensure_ascii=False, indent=2))
          PY

      - name: Commit verified recovery source and bundle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ImageLab Recovery Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add recovery/source recovery/evidence recovery/dist
          if git diff --cached --quiet; then
            echo 'Verified recovery output is already committed.'
            exit 0
          fi
          git commit -m 'recovery: complete controlled source reconstruction [recovery-rc04-09-output]'
          git push origin HEAD:bootstrap/zero-trust-gate

      - name: Upload complete recovery evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: imagelab-recovery-1.4.5-source-complete
          path: |
            recovery/evidence
            recovery/dist
            ${{ runner.temp }}/pytest-full.log
          if-no-files-found: warn
          retention-days: 30
