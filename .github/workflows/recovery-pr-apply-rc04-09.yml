name: Recovery PR Apply RC04-09

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/recovery-pr-apply-rc04-09.yml
      - recovery/patches/rc-04-09/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: imagelab-recovery-rc04-09
  cancel-in-progress: false

jobs:
  apply-verify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact recovery branch
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: bootstrap/zero-trust-gate
          fetch-depth: 0

      - name: Set up exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13.14'

      - name: Reconstruct and verify SHA-pinned recovery patch
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq '1.4.5-recovery-candidate' recovery/source/app/config.py && \
             grep -Fq 'REC-RT8-M6-20260724-02' recovery/source/app/config.py; then
            echo 'already_applied=true' >> "$GITHUB_OUTPUT"
            echo 'RC04-09 source identity is already present.'
            exit 0
          fi
          cat recovery/patches/rc-04-09/part-*.b64 > "$RUNNER_TEMP/rc04-09.patch.gz.b64"
          cat > "$RUNNER_TEMP/parts.sha256" <<'EOF'
          6ccc31e7c7a2e59b4f6e246eda701bc90bd77948ad8a288bded557e936ac8531  recovery/patches/rc-04-09/part-00.b64
          973d179f5533c9d9558cb714bd556ba0b5113d0b54c984f4b6525713879fe0a8  recovery/patches/rc-04-09/part-01.b64
          0f2e0bdc26f1e7bbc0682084c522d0c719a29dfffe8e2a78f2667df73df84c77  recovery/patches/rc-04-09/part-02.b64
          b69413da987f8ec6eb733e8c3fa61211379f50e2c6241767377d3fc13a46a0e6  recovery/patches/rc-04-09/part-03.b64
          7ff3ed250161a9410afb8327400ec3b4b5985eb4fb67e7fced38a54373078b0a  recovery/patches/rc-04-09/part-04.b64
          57e3966bc7587fec6bff945b6a962d34fbfa1da7af078dc9e2766314d999054d  recovery/patches/rc-04-09/part-05.b64
          e69c0c665eebed81c5f16e506385dc9d975a915e790d9061801ed680242b77d4  recovery/patches/rc-04-09/part-06.b64
          1472fa58b5a291d48750af767a7440de64dc267c09920118bda79d52e2eafe7e  recovery/patches/rc-04-09/part-07.b64
          EOF
          sed -i 's/^          //' "$RUNNER_TEMP/parts.sha256"
          sha256sum --check --strict "$RUNNER_TEMP/parts.sha256"
          echo '499aab619bb6d1bd6cac8b3a9cf656197f6dd7006fd91627c92f4e434b70fee8  '"$RUNNER_TEMP/rc04-09.patch.gz.b64" | sha256sum --check --strict
          base64 --decode "$RUNNER_TEMP/rc04-09.patch.gz.b64" > "$RUNNER_TEMP/rc04-09.patch.gz"
          echo '4101fedd2609e0574c4028dca228588c42bd53e0d92fa1c348d271745253249a  '"$RUNNER_TEMP/rc04-09.patch.gz" | sha256sum --check --strict
          gzip -dc "$RUNNER_TEMP/rc04-09.patch.gz" > "$RUNNER_TEMP/rc04-09.patch"
          echo '137640abe5810913c8870bec55a10284e1b7bf2589db84366a7c3d3ce451397d  '"$RUNNER_TEMP/rc04-09.patch" | sha256sum --check --strict
          git apply --check "$RUNNER_TEMP/rc04-09.patch"
          git apply "$RUNNER_TEMP/rc04-09.patch"
          grep -F '1.4.5-recovery-candidate' recovery/source/app/config.py
          grep -F 'REC-RT8-M6-20260724-02' recovery/source/app/config.py
          echo 'already_applied=false' >> "$GITHUB_OUTPUT"

      - name: Install exact source and test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            -r recovery/source/requirements.txt \
            pytest==9.0.2 \
            httpx==0.28.1

      - name: Run full source regression
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/recovery/source
          IMAGELAB_DATA_DIR: ${{ runner.temp }}/imagelab-recovery-regression-data
        run: |
          set -euo pipefail
          cd recovery/source
          python -m compileall -q app release_gate scripts tests
          node --check app/static/app.js
          python -m pytest -q | tee "$RUNNER_TEMP/pytest-full.log"
          grep -Eq '142 passed' "$RUNNER_TEMP/pytest-full.log"

      - name: Run exact 26-file Source Gate
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/recovery/source
          IMAGELAB_DATA_DIR: ${{ runner.temp }}/imagelab-recovery-source-gate-data
        run: |
          set -euo pipefail
          mkdir -p recovery/evidence
          python recovery/source/release_gate/source_gate.py \
            --output recovery/evidence/source-gate-recovery.json
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('recovery/evidence/source-gate-recovery.json')
          result = json.loads(path.read_text('utf-8'))
          assert result['status'] == 'PASS', result
          assert result['identity'] == {
              'version': '1.4.5-recovery-candidate',
              'build_id': 'REC-RT8-M6-20260724-02',
          }, result['identity']
          critical = result['checks']['critical_pytest']
          assert critical['exit_code'] == 0, critical
          assert len(critical['files']) == 26, len(critical['files'])
          assert all(item['exit_code'] == 0 for item in critical['files'].values())
          assert result['checks']['javascript']['exit_code'] == 0
          assert result['backend_selftest']['status'] == 'PASS'
          print('SOURCE_GATE_26_OF_26_PASS')
          PY

      - name: Build and verify deterministic recovery source ZIP twice
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import stat
          import zipfile
          from pathlib import Path

          root = Path('recovery/source')
          dist = Path('recovery/dist')
          evidence_dir = Path('recovery/evidence')
          dist.mkdir(parents=True, exist_ok=True)
          evidence_dir.mkdir(parents=True, exist_ok=True)
          deny_parts = {'.git', '__pycache__', '.pytest_cache', 'data', 'runtime-data', 'user-data'}
          files: list[tuple[str, Path]] = []
          for path in root.rglob('*'):
              if not path.is_file():
                  continue
              rel = path.relative_to(root)
              if set(rel.parts).intersection(deny_parts) or path.suffix == '.pyc':
                  continue
              files.append((rel.as_posix(), path))
          files.sort(key=lambda item: item[0])

          def build(path: Path) -> None:
              with zipfile.ZipFile(path, 'w') as archive:
                  for rel, source in files:
                      info = zipfile.ZipInfo(rel, date_time=(2026, 7, 24, 0, 0, 0))
                      info.create_system = 3
                      info.external_attr = (stat.S_IFREG | 0o644) << 16
                      info.compress_type = zipfile.ZIP_DEFLATED
                      archive.writestr(
                          info,
                          source.read_bytes(),
                          compress_type=zipfile.ZIP_DEFLATED,
                          compresslevel=9,
                      )

          candidate_a = dist / 'source-a.zip'
          candidate_b = dist / 'source-b.zip'
          build(candidate_a)
          build(candidate_b)
          bytes_a = candidate_a.read_bytes()
          bytes_b = candidate_b.read_bytes()
          assert bytes_a == bytes_b, 'deterministic source builds differ'
          source_sha = hashlib.sha256(bytes_a).hexdigest()
          expected_sha = 'e4268157d6abc5495eefa9799b09a5352d43102019c4f0047f7303597f6c2ea7'
          assert source_sha == expected_sha, (source_sha, expected_sha)
          members_sha = hashlib.sha256('\n'.join(rel for rel, _ in files).encode('utf-8')).hexdigest()
          assert len(files) == 87, len(files)
          assert members_sha == 'b0c43a785c437bf649750a5541386b81b6436c160aad07a5aa6903265581e2fe', members_sha
          final_zip = dist / 'ImageLab_by_LarannA_RECOVERY_1.4.5_SOURCE.zip'
          final_zip.write_bytes(bytes_a)
          candidate_a.unlink()
          candidate_b.unlink()
          manifest = {
              'schema': 1,
              'status': 'PASS',
              'identity': {
                  'version': '1.4.5-recovery-candidate',
                  'build_id': 'REC-RT8-M6-20260724-02',
              },
              'file': final_zip.name,
              'sha256': source_sha,
              'size_bytes': len(bytes_a),
              'member_count': len(files),
              'members_sha256': members_sha,
              'reproducible_builds': 2,
              'builds_byte_identical': True,
              'claim_boundary': 'Deterministic source recovery bundle only; no Windows installed-runtime authorization.',
          }
          (dist / 'source-manifest.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + '\n',
              'utf-8',
          )
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Write complete source recovery evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          source_gate = json.loads(Path('recovery/evidence/source-gate-recovery.json').read_text('utf-8'))
          manifest = json.loads(Path('recovery/dist/source-manifest.json').read_text('utf-8'))
          evidence = {
              'schema': 1,
              'status': 'PASS_SOURCE_RECOVERY_COMPLETE',
              'identity': manifest['identity'],
              'base': {
                  'version': '1.4.2-zero-trust-candidate',
                  'build_id': 'ZTR-M6-20260724-01',
                  'archive_sha256': 'c236656f53447996dc837a206a8896fc6abacf13d45829d8e9e64888b9f6b308',
              },
              'patches': {
                  'rc01_03_sha256': '674ff435d98487a99efde0b4a5081bb0acc311fde9f0a1a42e908b5011b951b5',
                  'rc04_09_sha256': '137640abe5810913c8870bec55a10284e1b7bf2589db84366a7c3d3ce451397d',
              },
              'checks': {
                  'full_pytest': '142/142 PASS',
                  'required_test_files': '26/26 PASS',
                  'compileall': 'PASS',
                  'javascript_syntax': 'PASS',
                  'backend_selftest': source_gate['backend_selftest']['status'],
                  'source_zip_reproducibility': '2/2 BYTE_IDENTICAL',
              },
              'source_bundle': manifest,
              'recovered_clusters': [
                  'RC-01 IZ017 color vector fidelity',
                  'RC-02 project storage concurrency and lineage',
                  'RC-03 AI audit concurrency',
                  'RC-04 bounded isolated processing cleanup',
                  'RC-05 product workflows and check-only diversion',
                  'RC-06 project lookup and Windows ID resilience',
                  'RC-07 adversarial contracts and exact identity',
                  'RC-08 segmentation governance and bounded support',
                  'RC-09 storage, WEBP PPI and CardLab package integrity',
              ],
              'claim_boundary': {
                  'source_recovery': 'PASS',
                  'windows_packaging': 'NOT_STARTED_FOR_RECOVERY_CANDIDATE',
                  'installed_windows_runtime_L4': 'UNVERIFIED',
                  'physical_user_path_L5': 'UNVERIFIED',
                  'update_rollback': 'UNVERIFIED',
                  'release': 'BLOCKED',
              },
          }
          Path('recovery/evidence/recovery-complete.json').write_text(
              json.dumps(evidence, ensure_ascii=False, indent=2) + '\n',
              'utf-8',
          )
          print(json.dumps(evidence, ensure_ascii=False, indent=2))
          PY

      - name: Commit verified recovery source and exact bundle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ImageLab Recovery Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add recovery/source recovery/evidence recovery/dist
          if git diff --cached --quiet; then
            echo 'Verified recovery output is already committed.'
            exit 0
          fi
          git commit -m 'recovery: complete controlled source reconstruction [recovery-rc04-09-output]'
          git push origin HEAD:bootstrap/zero-trust-gate

      - name: Upload complete recovery evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: imagelab-recovery-1.4.5-source-complete
          path: |
            recovery/evidence
            recovery/dist
            ${{ runner.temp }}/pytest-full.log
          if-no-files-found: warn
          retention-days: 30
