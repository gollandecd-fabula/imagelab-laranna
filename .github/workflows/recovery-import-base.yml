name: Recovery Import Base

on:
  push:
    branches:
      - bootstrap/zero-trust-gate
    paths:
      - .github/workflows/recovery-import-base.yml
      - bootstrap/imagelab-source.zip
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/recovery-import-base.yml
      - bootstrap/imagelab-source.zip
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: imagelab-recovery-import-base
  cancel-in-progress: false

jobs:
  import-base:
    if: ${{ !contains(github.event.head_commit.message || '', '[recovery-import-output]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: bootstrap/zero-trust-gate
          fetch-depth: 0

      - name: Set up exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13.14'

      - name: Verify and import immutable 1.4.2 base
        shell: bash
        env:
          EXPECTED_SHA256: c236656f53447996dc837a206a8896fc6abacf13d45829d8e9e64888b9f6b308
          EXPECTED_VERSION: 1.4.2-zero-trust-candidate
          EXPECTED_BUILD_ID: ZTR-M6-20260724-01
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import shutil
          import stat
          import zipfile
          from pathlib import Path, PurePosixPath

          archive = Path('bootstrap/imagelab-source.zip')
          output = Path('recovery/source')
          evidence_dir = Path('recovery/evidence')
          staging = Path('recovery/.source-staging')
          expected_sha = os.environ['EXPECTED_SHA256']
          expected_version = os.environ['EXPECTED_VERSION']
          expected_build_id = os.environ['EXPECTED_BUILD_ID']

          failures: list[str] = []
          actual_sha = hashlib.sha256(archive.read_bytes()).hexdigest()
          if actual_sha != expected_sha:
              failures.append('BASE_ARCHIVE_SHA256_MISMATCH')

          unsafe: list[str] = []
          forbidden: list[str] = []
          duplicates: list[str] = []
          seen: set[str] = set()
          deny_names = {
              '.env', '.env.local', 'cookies.txt', 'credentials.json',
              'secrets.json', 'token.json', 'id_rsa', 'id_ed25519',
          }
          deny_parts = {'.git', '__pycache__', '.pytest_cache', 'user-data', 'runtime-data'}

          with zipfile.ZipFile(archive) as zf:
              bad_crc = zf.testzip()
              if bad_crc:
                  failures.append(f'BASE_ARCHIVE_CRC_FAILURE:{bad_crc}')
              for info in zf.infolist():
                  name = info.filename
                  normalized = name.replace('\\', '/')
                  path = PurePosixPath(normalized)
                  parts = set(path.parts)
                  if (
                      name != normalized
                      or path.is_absolute()
                      or '..' in path.parts
                      or normalized.startswith('/')
                  ):
                      unsafe.append(name)
                  mode = info.external_attr >> 16
                  if stat.S_ISLNK(mode):
                      unsafe.append(name)
                  if normalized in seen:
                      duplicates.append(normalized)
                  seen.add(normalized)
                  if path.name.lower() in deny_names or parts.intersection(deny_parts):
                      forbidden.append(normalized)

              if unsafe:
                  failures.append('BASE_ARCHIVE_UNSAFE_MEMBERS')
              if duplicates:
                  failures.append('BASE_ARCHIVE_DUPLICATE_MEMBERS')
              if forbidden:
                  failures.append('BASE_ARCHIVE_FORBIDDEN_MEMBERS')

              if not failures:
                  shutil.rmtree(staging, ignore_errors=True)
                  staging.mkdir(parents=True, exist_ok=True)
                  zf.extractall(staging)

          required_core = [
              'app/config.py',
              'app/main.py',
              'app/services/project_store.py',
              'app/services/image_processing.py',
              'app/static/app.js',
          ]
          external_release_files = [
              'scripts/source_gate.py',
              'requirements.lock',
          ]
          missing = [item for item in required_core if not (staging / item).is_file()]
          external_absent = [item for item in external_release_files if not (staging / item).is_file()]
          if missing:
              failures.append('BASE_REQUIRED_CORE_FILES_MISSING')

          config_text = (staging / 'app/config.py').read_text(encoding='utf-8') if (staging / 'app/config.py').is_file() else ''
          if expected_version not in config_text:
              failures.append('BASE_VERSION_IDENTITY_MISMATCH')
          if expected_build_id not in config_text:
              failures.append('BASE_BUILD_IDENTITY_MISMATCH')

          evidence = {
              'schema': 1,
              'status': 'FAIL' if failures else 'PASS',
              'mode': 'CONTROLLED_RECOVERY_BASE_IMPORT',
              'archive': {
                  'path': str(archive),
                  'expected_sha256': expected_sha,
                  'actual_sha256': actual_sha,
                  'member_count': len(seen),
                  'members_sha256': hashlib.sha256('\n'.join(sorted(seen)).encode('utf-8')).hexdigest(),
                  'unsafe_members': sorted(set(unsafe)),
                  'duplicate_members': sorted(set(duplicates)),
                  'forbidden_members': sorted(set(forbidden)),
              },
              'identity': {
                  'expected_version': expected_version,
                  'expected_build_id': expected_build_id,
              },
              'required_core_missing': missing,
              'external_release_files_absent_from_source_archive': external_absent,
              'failures': failures,
          }
          evidence_dir.mkdir(parents=True, exist_ok=True)
          (evidence_dir / 'base-import.json').write_text(
              json.dumps(evidence, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          if failures:
              print(json.dumps(evidence, ensure_ascii=False, indent=2))
              raise SystemExit(1)

          shutil.rmtree(output, ignore_errors=True)
          output.parent.mkdir(parents=True, exist_ok=True)
          staging.replace(output)
          print(json.dumps(evidence, ensure_ascii=False, indent=2))
          PY

      - name: Commit imported baseline tree
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ImageLab Recovery Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add recovery/source recovery/evidence/base-import.json
          if git diff --cached --quiet; then
            echo 'Verified baseline already imported; no commit required.'
            exit 0
          fi
          git commit -m 'recovery: materialize verified 1.4.2 baseline [recovery-import-output]'
          git push origin HEAD:bootstrap/zero-trust-gate

      - name: Upload import evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: imagelab-recovery-base-import
          path: recovery/evidence/base-import.json
          if-no-files-found: error
          retention-days: 30
