name: SINDEL C05C Prefill Relay R3C

on:
  push:
    branches: [sindel-c05b-wheelhouse-r3]
    paths:
      - '.github/workflows/sindel-c05c-prefill-relay-r3c.yml'
      - 'sindel/c05c/prefill-relay-trigger.txt'

permissions:
  contents: read
  actions: read

jobs:
  relay-prefill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download accepted prefill artifact from run 35060452010
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/prefill_relay"
          mkdir -p "$D/source" "$D/parts" "$D/evidence"
          gh run download 35060452010 --repo "$GITHUB_REPOSITORY" --name SINDEL_C05C_T3_PREFILL_R3C --dir "$D/source"
          P="$D/source/out/t3_prefill.pte"
          test -s "$P"
          test "$(stat -c %s "$P")" = '1058764416'
          test "$(sha256sum "$P" | awk '{print $1}')" = '967728e7cda4b0f636f9813d288dafe0759216f17b6c690063397b3b4d1ad459'
          cp "$D/source/evidence/t3_prefill.sha256" "$D/evidence/original_t3_prefill.sha256"
          split -b 300M -d -a 2 "$P" "$D/parts/t3_prefill.part."
          test "$(find "$D/parts" -type f | wc -l)" = '4'
          (cd "$D/parts" && sha256sum t3_prefill.part.*) > "$D/evidence/PART_SHA256SUMS.txt"
          cat > "$D/evidence/REASSEMBLY.txt" <<'EOF'
          cat t3_prefill.part.00 t3_prefill.part.01 t3_prefill.part.02 t3_prefill.part.03 > t3_prefill.pte
          Expected size: 1058764416
          Expected SHA256: 967728e7cda4b0f636f9813d288dafe0759216f17b6c690063397b3b4d1ad459
          EOF
          ls -lh "$D/parts"
          cat "$D/evidence/PART_SHA256SUMS.txt"

      - name: Upload part 00
        uses: actions/upload-artifact@v4
        with:
          name: SINDEL_C05C_T3_PREFILL_R3C_PART00
          path: ${{ runner.temp }}/prefill_relay/parts/t3_prefill.part.00
          compression-level: 0
          retention-days: 7

      - name: Upload part 01
        uses: actions/upload-artifact@v4
        with:
          name: SINDEL_C05C_T3_PREFILL_R3C_PART01
          path: ${{ runner.temp }}/prefill_relay/parts/t3_prefill.part.01
          compression-level: 0
          retention-days: 7

      - name: Upload part 02
        uses: actions/upload-artifact@v4
        with:
          name: SINDEL_C05C_T3_PREFILL_R3C_PART02
          path: ${{ runner.temp }}/prefill_relay/parts/t3_prefill.part.02
          compression-level: 0
          retention-days: 7

      - name: Upload part 03
        uses: actions/upload-artifact@v4
        with:
          name: SINDEL_C05C_T3_PREFILL_R3C_PART03
          path: ${{ runner.temp }}/prefill_relay/parts/t3_prefill.part.03
          compression-level: 0
          retention-days: 7

      - name: Upload relay evidence
        uses: actions/upload-artifact@v4
        with:
          name: SINDEL_C05C_T3_PREFILL_R3C_RELAY_EVIDENCE
          path: ${{ runner.temp }}/prefill_relay/evidence/
          compression-level: 0
          retention-days: 7
