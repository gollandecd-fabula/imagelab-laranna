name: ImageLab RC11 Windows Gate Execution

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-windows-gate-rc11-execution.yml
      - bootstrap/imagelab-source.zip
      - bootstrap/imagelab-source.sha256
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: imagelab-rc11-windows-execution
  cancel-in-progress: false

env:
  PYTHONUTF8: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  EXACT_PYTHON_VERSION: '3.13.14'
  EXPECTED_SOURCE_SHA256: 'e130ce027c2d54b72161afe6b9882f66a4311f01d7249b6c7e9bbd9ce4645327'
  EXPECTED_APP_VERSION: '1.4.7-recovery-candidate'
  EXPECTED_BUILD_ID: 'REC-RT8-M6-20260724-04'

jobs:
  b0:
    name: B0 exact source admission
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: bootstrap/zero-trust-gate
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ env.EXACT_PYTHON_VERSION }}
      - name: Verify exact bundle
        shell: bash
        run: |
          set -euo pipefail
          python bootstrap/verify_source_bundle.py \
            --archive bootstrap/imagelab-source.zip \
            --checksum bootstrap/imagelab-source.sha256 \
            --output b0/source-bundle.json \
            --extract-to source-tree \
            --expected-sha256 "$EXPECTED_SOURCE_SHA256" \
            --expected-version "$EXPECTED_APP_VERSION" \
            --expected-build-id "$EXPECTED_BUILD_ID"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: rc11-b0-evidence
          path: b0/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: rc11-source-tree
          path: source-tree/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  b1:
    name: B1 source and regression gate
    needs: b0
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: rc11-source-tree
          path: source-tree
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ env.EXACT_PYTHON_VERSION }}
      - name: Install exact dependencies
        working-directory: source-tree
        run: python -m pip install -r requirements.txt pytest==9.0.2 httpx==0.28.1
      - name: Run 26-file Source Gate
        working-directory: source-tree
        run: python release_gate/source_gate.py --output rc11-evidence/source-gate.json
      - name: Repeat six critical regressions
        working-directory: source-tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rc11-evidence/unit
          for test_file in \
            tests/test_core_failure_regression.py \
            tests/test_second_core_failure_regression.py \
            tests/test_l5_iz017_regression.py \
            tests/test_slu_m1_units.py \
            tests/test_slu_m5_e2e.py \
            tests/test_zero_trust_release_gate.py; do
            case_id="$(basename "$test_file" .py)"
            python release_gate/run_unit_case.py \
              --case-id "$case_id" \
              --test-file "$test_file" \
              --output "rc11-evidence/unit/$case_id.json" \
              --timeout 600
          done
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: rc11-b1-evidence
          path: source-tree/rc11-evidence/
          if-no-files-found: warn
          retention-days: 30

  b2:
    name: B2 reproducible Windows candidate
    needs: b1
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: rc11-source-tree
          path: source-tree
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ env.EXACT_PYTHON_VERSION }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.25.x'
          cache: false
      - name: Build twice and compare exact installer SHA
        working-directory: source-tree
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/build_zero_trust_candidate.py --output-dir dist-a --label RC11_WINDOWS
          python scripts/build_zero_trust_candidate.py --output-dir dist-b --label RC11_WINDOWS
          $a = Get-Content -Raw dist-a/candidate-manifest.json | ConvertFrom-Json
          $b = Get-Content -Raw dist-b/candidate-manifest.json | ConvertFrom-Json
          if ($a.installer.sha256 -ne $b.installer.sha256) { throw 'Non-reproducible installer build' }
          if ($a.identity.version -ne $env:EXPECTED_APP_VERSION) { throw 'Version mismatch' }
          if ($a.identity.build_id -ne $env:EXPECTED_BUILD_ID) { throw 'Build ID mismatch' }
          New-Item -ItemType Directory -Force exact-candidate | Out-Null
          Copy-Item dist-a/* exact-candidate/ -Force
          @{
            schema = 1
            status = 'PASS'
            source_sha256 = $env:EXPECTED_SOURCE_SHA256
            installer_sha256 = $a.installer.sha256
            second_build_sha256 = $b.installer.sha256
          } | ConvertTo-Json | Set-Content exact-candidate/reproducibility.json -Encoding utf8
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: rc11-windows-candidate
          path: source-tree/exact-candidate/
          if-no-files-found: error
          retention-days: 2

  b3_b5:
    name: B3-B5 clean install and installed UI
    needs: b2
    runs-on: windows-2022
    timeout-minutes: 70
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: rc11-source-tree
          path: source-tree
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: rc11-windows-candidate
          path: exact-candidate
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ env.EXACT_PYTHON_VERSION }}
      - name: Install external browser harness
        working-directory: source-tree
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-release.txt
          python -m playwright install chromium
          python -c "import PIL; import playwright.sync_api; print('EXTERNAL_GATE_PYTHON_PASS')"
      - name: Execute clean installed user path
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = (Get-ChildItem exact-candidate -Filter *.exe -File | Select-Object -First 1).FullName
          ./source-tree/release_gate/run_clean_install_gate.ps1 `
            -InstallerPath $installer `
            -CandidateManifestPath exact-candidate/candidate-manifest.json `
            -EvidenceDir evidence-clean `
            -Mode clean `
            -BrowserChannel msedge
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: rc11-clean-install-evidence
          path: evidence-clean/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  b8:
    name: B8 independent installed rerun
    needs: b2
    runs-on: windows-2022
    timeout-minutes: 70
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: rc11-source-tree
          path: source-tree
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: rc11-windows-candidate
          path: exact-candidate
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ env.EXACT_PYTHON_VERSION }}
      - name: Install independent external harness
        working-directory: source-tree
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-release.txt
          python -m playwright install chromium
          python -c "import PIL; import playwright.sync_api; print('EXTERNAL_GATE_PYTHON_PASS')"
      - name: Execute independent installed user path
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = (Get-ChildItem exact-candidate -Filter *.exe -File | Select-Object -First 1).FullName
          ./source-tree/release_gate/run_clean_install_gate.ps1 `
            -InstallerPath $installer `
            -CandidateManifestPath exact-candidate/candidate-manifest.json `
            -EvidenceDir evidence-independent `
            -Mode independent `
            -BrowserChannel bundled
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: rc11-independent-evidence
          path: evidence-independent/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  verdict:
    name: RC11 verdict — release remains blocked
    if: ${{ always() }}
    needs: [b0, b1, b2, b3_b5, b8]
    runs-on: ubuntu-24.04
    steps:
      - name: Write exact verdict
        shell: bash
        run: |
          mkdir -p verdict
          cat > verdict/final-verdict.json <<JSON
          {
            "schema": 1,
            "status": "RELEASE_BLOCKED",
            "run_id": "${GITHUB_RUN_ID}",
            "source_sha256": "${EXPECTED_SOURCE_SHA256}",
            "version": "${EXPECTED_APP_VERSION}",
            "build_id": "${EXPECTED_BUILD_ID}",
            "b0": "${{ needs.b0.result }}",
            "b1": "${{ needs.b1.result }}",
            "b2": "${{ needs.b2.result }}",
            "b3_b5": "${{ needs.b3_b5.result }}",
            "b8": "${{ needs.b8.result }}",
            "update_rollback": "UNVERIFIED",
            "physical_l5": "UNVERIFIED"
          }
          JSON
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: rc11-final-verdict
          path: verdict/
          retention-days: 90
      - name: Enforce fail-closed state
        run: exit 1
