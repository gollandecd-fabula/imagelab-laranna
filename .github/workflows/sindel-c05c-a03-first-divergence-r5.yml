name: SINDEL C05C A03 First Divergence R5

on:
  push:
    branches: [sindel-cp034-a03-first-divergence-20260917]
    paths:
      - 'sindel/c05c/C05C_T3_FIRST_DIVERGENCE_R5.py'
      - '.github/workflows/sindel-c05c-a03-first-divergence-r5.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  a03-first-divergence:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.15'
          check-latest: false

      - name: Restore exact frozen export environment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/C05C_EXPORT_ENV_R3"; mkdir -p "$E"
          gh run download 35055036918 -R "$GITHUB_REPOSITORY" -n C05C_EXPORT_ENV_R3 -D "$E"
          LOCK=$(find "$E" -name C05C_EXPORT_ENV_LOCK_R3.json -print -quit); test -n "$LOCK"
          BASE=$(dirname "$LOCK")
          test "$(sha256sum "$BASE/C05C_EXPORT_ENV_LOCK_R3.json" | awk '{print $1}')" = '05ab0315a31ad48ef36b834b2305ea3c59dabe13ed104beb752d65686b7449d2'
          test "$(sha256sum "$BASE/requirements.offline.freeze.txt" | awk '{print $1}')" = '52d2ac268b1defd446e6778c612c2de6b3a889165e0cd0737f927d264e6797b5'
          (cd "$BASE" && sha256sum -c SHA256SUMS.txt)
          python -m venv "$RUNNER_TEMP/c05c_exact_env"
          "$RUNNER_TEMP/c05c_exact_env/bin/python" -m pip install --disable-pip-version-check --no-input --no-index --find-links "$BASE/wheelhouse" -r "$BASE/requirements.offline.freeze.txt"
          "$RUNNER_TEMP/c05c_exact_env/bin/python" -m pip freeze | LC_ALL=C sort > "$RUNNER_TEMP/freeze.txt"
          cmp -s "$RUNNER_TEMP/freeze.txt" "$BASE/requirements.offline.freeze.txt"
          echo "SINDEL_PY=$RUNNER_TEMP/c05c_exact_env/bin/python" >> "$GITHUB_ENV"
          echo "SINDEL_C05C_WORK=$RUNNER_TEMP/sindel_c05c_work" >> "$GITHUB_ENV"
          echo "SINDEL_C05C_A03_OUT=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "OMP_NUM_THREADS=4" >> "$GITHUB_ENV"
          echo "MKL_NUM_THREADS=4" >> "$GITHUB_ENV"
          echo "OPENBLAS_NUM_THREADS=4" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/c05c_exact_env/bin" >> "$GITHUB_PATH"

      - name: Static preflight
        shell: bash
        run: |
          set -euo pipefail
          "$SINDEL_PY" -m py_compile sindel/c05c/C05C_T3_SHARED_STORE_ISOLATED_R4.py sindel/c05c/C05C_T3_SHARED_STORE_ISOLATED_R5.py sindel/c05c/C05C_T3_FIRST_DIVERGENCE_R5.py
          "$SINDEL_PY" - <<'PY'
          import sys
          sys.path.insert(0,'sindel/c05c')
          import C05C_T3_SHARED_STORE_ISOLATED_R5 as r
          assert r.THRESHOLDS=={'cosine_min':0.9999,'mean_abs_max':0.005,'max_abs_max':0.05,'finite_required':True}
          assert r.CFG_WEIGHT==0.03
          print('A03_STATIC_PRECHECK_OK')
          PY

      - name: Prepare frozen source and exact T3
        shell: bash
        run: |
          set -euo pipefail
          W="$SINDEL_C05C_WORK"; mkdir -p "$W/source" "$W/model"
          git clone --quiet https://github.com/resemble-ai/chatterbox.git "$RUNNER_TEMP/chatterbox"
          git -C "$RUNNER_TEMP/chatterbox" checkout --quiet 5de7a54aa4e5e2baadb0182dde554908b48b85c2
          test "$(git -C "$RUNNER_TEMP/chatterbox" rev-parse HEAD)" = '5de7a54aa4e5e2baadb0182dde554908b48b85c2'
          cp -a "$RUNNER_TEMP/chatterbox/src/chatterbox" "$W/source/"
          "$SINDEL_PY" - <<'PY'
          from huggingface_hub import hf_hub_download
          from pathlib import Path
          import hashlib, shutil, os
          W=Path(os.environ['SINDEL_C05C_WORK'])
          src=Path(hf_hub_download(repo_id='ResembleAI/chatterbox',filename='t3_mtl23ls_v3.safetensors'))
          dst=W/'model/t3_mtl23ls_v3.safetensors'; shutil.copy2(src,dst)
          assert hashlib.sha256(dst.read_bytes()).hexdigest()=='5abca8321ede76f8e61f1cc0d19aea6c946b28871017ce8726f8a69203f05953'
          PY
          test "$(sha256sum sindel/c05c/C05C_T3_PREFILL_R3C.py | awk '{print $1}')" = '0b6e906bf4066606992f9b562989569567f623715ffe62f9b9a91b59fab44971'

      - name: Run A03 first-divergence diagnostic
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v "$SINDEL_PY" -u sindel/c05c/C05C_T3_FIRST_DIVERGENCE_R5.py | tee "$RUNNER_TEMP/a03_stdout.txt"
          test -s "$RUNNER_TEMP/c05c_a03_first_divergence_r5/C05C_A03_FIRST_DIVERGENCE_EVIDENCE_R5.json"

      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SINDEL_C05C_A03_FIRST_DIVERGENCE_R5_EVIDENCE
          path: |
            ${{ runner.temp }}/c05c_a03_first_divergence_r5/C05C_A03_FIRST_DIVERGENCE_EVIDENCE_R5.json
            ${{ runner.temp }}/c05c_a03_first_divergence_r5/*.npz
            ${{ runner.temp }}/a03_stdout.txt
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

      - name: Evidence contract
        shell: bash
        run: |
          set -euo pipefail
          "$SINDEL_PY" - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['SINDEL_C05C_A03_OUT'])/'c05c_a03_first_divergence_r5'/'C05C_A03_FIRST_DIVERGENCE_EVIDENCE_R5.json'
          d=json.loads(p.read_text())
          assert d['schema']=='sindel.cp034.c05c.a03-first-divergence-r5.v1'
          assert d['classification']
          assert d['frozen_thresholds_unchanged']=={'cosine_min':0.9999,'mean_abs_max':0.005,'max_abs_max':0.05,'finite_required':True}
          assert len(d['raw_npz_sha256'])==6
          print('A03_EVIDENCE_CAPTURED',d['status'],d['classification'])
          PY
