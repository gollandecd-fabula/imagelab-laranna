name: SINDEL C05B Wheelhouse R3

on:
  push:
    branches:
      - sindel-c05b-wheelhouse-r3
    paths:
      - '.github/workflows/sindel-c05b-wheelhouse-r3.yml'
      - 'sindel/c05b/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wheelhouse:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout build-factory branch
        uses: actions/checkout@v4
      - name: Set up CPython 3.11.15
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.15'
      - name: Build, lock and offline-verify wheelhouse
        shell: bash
        run: bash sindel/c05b/build_wheelhouse.sh
      - name: Upload immutable C05B dependency artifact
        uses: actions/upload-artifact@v4
        with:
          name: C05B_WHEELHOUSE_R3
          path: sindel/c05b/out/C05B_WHEELHOUSE_R3
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
