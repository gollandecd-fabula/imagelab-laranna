name: ImageLab Evidence Hardening CI

on:
  pull_request:
    branches:
      - bootstrap/zero-trust-gate
    paths:
      - recovery/source/bootstrap.py
      - recovery/source/app/entry.py
      - recovery/source/app/services/file_inspector.py
      - recovery/source/app/services/project_store.py
      - recovery/source/app/static/index.html
      - recovery/source/app/static/styles.css
      - recovery/source/app/static/app.js
      - recovery/source/app/static/m1-hardening.css
      - recovery/source/app/static/m1-hardening.js
      - recovery/source/release_gate/fetch_pinned_json.py
      - recovery/source/release_gate/finalize_gate.py
      - recovery/source/release_gate/finalize_unit_matrix.py
      - recovery/source/release_gate/run_update_rollback_gate.ps1
      - recovery/source/windows_installer/installer/main.go
      - recovery/source/windows_installer/installer/main_test.go
      - recovery/source/windows_installer/launcher/main.go
      - recovery/source/windows_installer/launcher/main_test.go
      - recovery/source/windows_installer/uninstaller/main.go
      - recovery/source/windows_installer/uninstaller/main_test.go
      - recovery/source/tests/test_m1_ui.py
      - recovery/source/tests/test_browser_m1.py
      - recovery/source/tests/test_windows_packaging_config.py
      - recovery/source/.github/workflows/zero-trust-release.yml
      - recovery/source/tests/test_project_lookup_resilience.py
      - recovery/source/tests/test_project_store_concurrency.py
      - recovery/source/tests/test_upload_surface_hardening.py
      - recovery/source/tests/test_zero_trust_release_gate.py
      - recovery/source/docs/ZERO_TRUST_RELEASE_GATE_RTM_V1.md
      - recovery/source/docs/ZERO_TRUST_RELEASE_GATE_RUNBOOK_V1.md
      - recovery/evidence/full-audit-20260725/**
      - .github/workflows/codex-evidence-hardening-ci.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: imagelab-evidence-hardening-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  python-contracts:
    name: Python release-gate contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: recovery/source
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13.14'
      - name: Install exact dependencies
        run: |
          python -m pip install -q --requirement requirements.txt
          python -m pip install -q pytest==8.4.2 httpx==0.28.1
      - name: Compile changed Python contracts
        run: >-
          python -m compileall -q
          bootstrap.py
          app/entry.py
          app/services/file_inspector.py
          app/services/project_store.py
          release_gate/fetch_pinned_json.py
          release_gate/finalize_gate.py
          release_gate/finalize_unit_matrix.py
          tests/test_m1_ui.py
          tests/test_project_lookup_resilience.py
          tests/test_project_store_concurrency.py
          tests/test_upload_surface_hardening.py
          tests/test_windows_packaging_config.py
          tests/test_zero_trust_release_gate.py
      - name: Validate JavaScript syntax
        run: |
          node --check app/static/app.js
          node --check app/static/m1-hardening.js
      - name: Run focused hardening tests
        run: >-
          python -m pytest
          tests/test_m1_ui.py
          tests/test_windows_packaging_config.py
          tests/test_zero_trust_release_gate.py
          tests/test_project_store_concurrency.py
          tests/test_project_lookup_resilience.py
          tests/test_upload_surface_hardening.py
          -vv --tb=short
      - name: Run complete source test suite
        run: |
          set +e
          python -m pytest -q > full-suite.log 2>&1
          code=$?
          tail -n 160 full-suite.log
          exit $code
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: ImageLab-evidence-hardening-python
          path: recovery/source/full-suite.log
          retention-days: 30
          if-no-files-found: warn

  powershell-contract:
    name: Windows PowerShell parser contract
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - name: Parse update and rollback gate
        shell: pwsh
        run: |
          $path = Join-Path $PWD 'recovery/source/release_gate/run_update_rollback_gate.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host "PowerShell parser contract PASS"

  installer-archive-contract:
    name: Windows installer archive policy
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.24.5'
          cache: false
      - name: Run installer ZIP admission tests on Windows
        shell: pwsh
        run: |
          $installer = Join-Path $PWD 'recovery/source/windows_installer/installer'
          Push-Location $installer
          try {
            Add-Type -AssemblyName System.IO.Compression
            $stream = [System.IO.File]::Create((Join-Path $installer 'payload.zip'))
            try {
              $archive = [System.IO.Compression.ZipArchive]::new($stream, [System.IO.Compression.ZipArchiveMode]::Create, $false)
              $archive.Dispose()
            } finally {
              $stream.Dispose()
            }
            $env:GO111MODULE = 'off'
            go test -v .
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Remove-Item -Force -ErrorAction SilentlyContinue (Join-Path $installer 'payload.zip')
            Pop-Location
          }

  browser-ui-contract:
    name: Browser UI M1 contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: recovery/source
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13.14'
      - name: Install exact UI test dependencies
        run: |
          python -m pip install -q --requirement requirements.txt
          python -m pip install -q pytest==8.4.2 httpx==0.28.1 playwright==1.60.0
          python -m playwright install --with-deps chromium
      - name: Run real-browser M1 contracts
        run: python -m pytest tests/test_browser_m1.py -vv --tb=short

  windows-lifecycle-contract:
    name: Windows launcher and uninstaller contracts
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.24.5'
          cache: false
      - name: Run launcher process cleanup tests
        shell: pwsh
        run: |
          $env:GO111MODULE = 'off'
          Push-Location 'recovery/source/windows_installer/launcher'
          try { go test -v .; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } } finally { Pop-Location }
      - name: Run uninstaller ownership and quoting tests
        shell: pwsh
        run: |
          $env:GO111MODULE = 'off'
          Push-Location 'recovery/source/windows_installer/uninstaller'
          try { go test -v .; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } } finally { Pop-Location }
