name: ImageLab Current Release State Consistency

on:
  push:
    branches:
      - bootstrap/zero-trust-gate
      - codex/imagelab-state-consistency
    paths:
      - bootstrap/README.md
      - recovery/evidence/current-release-state.json
      - recovery/evidence/windows-gate/rc13-windows-evidence-summary.json
      - recovery/evidence/update-rollback/g6-authorized-baseline-blocker.json
      - tools/verify_current_release_state.py
      - .github/workflows/current-release-state-consistency.yml
  pull_request:
    branches:
      - bootstrap/zero-trust-gate
    paths:
      - bootstrap/README.md
      - recovery/evidence/current-release-state.json
      - recovery/evidence/windows-gate/rc13-windows-evidence-summary.json
      - recovery/evidence/update-rollback/g6-authorized-baseline-blocker.json
      - tools/verify_current_release_state.py
      - .github/workflows/current-release-state-consistency.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: imagelab-current-release-state-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: '1'
  EXACT_PYTHON_VERSION: '3.13.14'

jobs:
  verify-current-release-state:
    name: Verify current release state against evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ env.EXACT_PYTHON_VERSION }}
      - name: Verify machine-readable state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p current-state-evidence
          python tools/verify_current_release_state.py \
            | tee current-state-evidence/verdict.json
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: ImageLab-current-release-state-${{ github.run_id }}
          path: current-state-evidence/
          retention-days: 30
          if-no-files-found: error
