name: Diagnose ImageLab 1.4.6 Python Resolution

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/diagnose-python-resolution-146.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  SOURCE_RUN_ID: '30106203909'
  EXPECTED_INSTALLER_SHA256: 'f67aac4ac412d4b934fc672bc25cf949e36ec54c02b3bb2fd5277a7f1d5c180f'

jobs:
  diagnose-python-resolution:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: bootstrap-source-tree
          path: source-tree
          repository: gollandecd-fabula/imagelab-laranna
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: UNVERIFIED_BOOTSTRAP_WINDOWS_CANDIDATE
          path: exact-candidate
          repository: gollandecd-fabula/imagelab-laranna
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13.14'

      - name: Install exact test harness and capture host Python
        id: host_python
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force diagnostics-python,evidence-python | Out-Null
          python -m pip install --requirement source-tree/requirements.txt
          python -m pip install --requirement source-tree/requirements-release.txt
          python -m playwright install chromium
          $hostPython = (Get-Command python -CommandType Application).Source
          if (-not (Test-Path -LiteralPath $hostPython)) { throw 'Host Python path not found' }
          "host_python=$hostPython" >> $env:GITHUB_OUTPUT
          @{
            schema = 1
            host_python = $hostPython
            where_python = @(where.exe python)
            path = $env:PATH
          } | ConvertTo-Json -Depth 5 | Set-Content diagnostics-python/preinstall-resolution.json -Encoding utf8
          & $hostPython -c "import sys, PIL; print(sys.executable); print(PIL.__version__)" *>&1 |
            Tee-Object diagnostics-python/preinstall-import.log

      - name: Run existing harness and preserve failure
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          $installer = (Get-ChildItem exact-candidate -Filter *.exe -File | Select-Object -First 1).FullName
          $sha = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          if ($sha -ne $env:EXPECTED_INSTALLER_SHA256) { throw "Installer SHA mismatch: $sha" }
          try {
            & ./source-tree/release_gate/run_clean_install_gate.ps1 `
              -InstallerPath $installer `
              -CandidateManifestPath exact-candidate/candidate-manifest.json `
              -EvidenceDir evidence-python `
              -Mode independent `
              -BrowserChannel bundled *>&1 |
              Tee-Object diagnostics-python/original-harness.log
          } catch {
            $_ | Format-List * -Force | Out-String |
              Tee-Object -FilePath diagnostics-python/original-harness-exception.log
          }
          exit 0

      - name: Capture postinstall Python resolution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $hostPython = '${{ steps.host_python.outputs.host_python }}'
          @{
            schema = 1
            captured_host_python = $hostPython
            get_command_python = (Get-Command python -ErrorAction SilentlyContinue | Select-Object Name,Source,Path,CommandType)
            where_python = @(where.exe python 2>&1)
            path = $env:PATH
          } | ConvertTo-Json -Depth 8 | Set-Content diagnostics-python/postinstall-resolution.json -Encoding utf8
          python -c "import sys; print(sys.executable); import PIL; print(PIL.__version__)" *>&1 |
            Tee-Object diagnostics-python/postinstall-bare-python.log
          & $hostPython -c "import sys; print(sys.executable); import PIL; print(PIL.__version__)" *>&1 |
            Tee-Object diagnostics-python/postinstall-captured-python.log
          exit 0

      - name: Repeat UI gate through captured host Python
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          $hostPython = '${{ steps.host_python.outputs.host_python }}'
          $environment = Get-Content -Raw evidence-python/environment.json | ConvertFrom-Json
          $manifest = $environment.installed_manifest
          $installerSha = $environment.installer_sha256
          try {
            & $hostPython source-tree/release_gate/ui_gate.py `
              --base-url $environment.base_url `
              --evidence-dir evidence-python-captured `
              --installer-sha256 $installerSha `
              --expected-version $manifest.version `
              --expected-build-id $manifest.build_id `
              --expected-install-id $manifest.install_id `
              --browser-channel bundled *>&1 |
              Tee-Object diagnostics-python/captured-ui-gate.log
            $uiExit = $LASTEXITCODE
            if ($uiExit -eq 0) {
              & $hostPython source-tree/release_gate/validate_outputs.py `
                --evidence-dir evidence-python-captured `
                --installer-sha256 $installerSha *>&1 |
                Tee-Object diagnostics-python/captured-output-validation.log
              $validationExit = $LASTEXITCODE
            } else {
              $validationExit = -1
            }
          } catch {
            $_ | Format-List * -Force | Out-String |
              Tee-Object -FilePath diagnostics-python/captured-ui-exception.log
            $uiExit = 1
            $validationExit = -1
          }
          @{
            schema = 1
            ui_exit_code = $uiExit
            output_validation_exit_code = $validationExit
            status = if ($uiExit -eq 0 -and $validationExit -eq 0) { 'PASS' } else { 'FAIL' }
          } | ConvertTo-Json | Set-Content diagnostics-python/captured-ui-result.json -Encoding utf8
          exit 0

      - name: Upload Python-resolution diagnostics
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: imagelab-1.4.6-python-resolution-diagnostics
          path: |
            diagnostics-python/
            evidence-python/
            evidence-python-captured/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
