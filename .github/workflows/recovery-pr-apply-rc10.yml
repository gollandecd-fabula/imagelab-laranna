name: Recovery PR Apply RC10

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/recovery-pr-apply-rc10.yml
      - recovery/patches/rc-10-installer-wait.patch.gz.b64
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-verify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact recovery branch
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: bootstrap/zero-trust-gate
          fetch-depth: 0

      - name: Set up exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13.14'

      - name: Admit and apply exact RC-10 patch
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq '1.4.6-recovery-candidate' recovery/source/app/config.py && \
             grep -Fq 'REC-RT8-M6-20260724-03' recovery/source/app/config.py; then
            echo 'RC-10 source identity is already present.'
            exit 0
          fi
          python - <<'PY'
          from __future__ import annotations
          import base64
          import gzip
          import hashlib
          import subprocess
          from pathlib import Path

          payload = Path('recovery/patches/rc-10-installer-wait.patch.gz.b64').read_bytes()
          assert hashlib.sha256(payload).hexdigest() == '13f50c8a58d7869e52b7b457dffc7d0337aed9fe759783a1e836fe75778f84da'
          gzip_bytes = base64.b64decode(payload, validate=True)
          assert hashlib.sha256(gzip_bytes).hexdigest() == 'd9f64a3b96f55e3783c75b91c80dd1e5479a6c07b7e43fee836e16843961135d'
          patch_bytes = gzip.decompress(gzip_bytes)
          assert hashlib.sha256(patch_bytes).hexdigest() == '023b83a9d449fdad27aa5e63610cd12ef7fa8d2bee8fb67b481a31815adfa799'
          patch = Path('/tmp/rc10.patch')
          patch.write_bytes(patch_bytes)
          subprocess.run(['git', 'apply', '--check', '--directory=recovery/source', str(patch)], check=True)
          subprocess.run(['git', 'apply', '--directory=recovery/source', str(patch)], check=True)
          PY
          grep -F '1.4.6-recovery-candidate' recovery/source/app/config.py
          grep -F 'REC-RT8-M6-20260724-03' recovery/source/app/config.py

      - name: Install exact source and test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            -r recovery/source/requirements.txt \
            pytest==9.0.2 \
            httpx==0.28.1

      - name: Run exact 143-test regression
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/recovery/source
          IMAGELAB_DATA_DIR: ${{ runner.temp }}/imagelab-rc10-regression-data
        run: |
          set -euo pipefail
          cd recovery/source
          python -m compileall -q app release_gate scripts tests
          node --check app/static/app.js
          python -m pytest -q --junitxml="$RUNNER_TEMP/pytest-full.xml" | tee "$RUNNER_TEMP/pytest-full.log"
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          root = ET.parse(Path(os.environ['RUNNER_TEMP']) / 'pytest-full.xml').getroot()
          suites = [root] if root.tag == 'testsuite' else list(root.findall('testsuite'))
          counts = {
              key: sum(int(suite.attrib.get(key, '0')) for suite in suites)
              for key in ('tests', 'failures', 'errors', 'skipped')
          }
          assert counts == {'tests': 143, 'failures': 0, 'errors': 0, 'skipped': 0}, counts
          print('PYTEST_143_OF_143_PASS')
          PY

      - name: Run exact 26-file Source Gate
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/recovery/source
          IMAGELAB_DATA_DIR: ${{ runner.temp }}/imagelab-rc10-source-gate-data
        run: |
          set -euo pipefail
          mkdir -p recovery/evidence
          python recovery/source/release_gate/source_gate.py \
            --output recovery/evidence/source-gate-recovery-1.4.6.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('recovery/evidence/source-gate-recovery-1.4.6.json').read_text('utf-8'))
          assert result['status'] == 'PASS', result
          assert result['identity'] == {
              'version': '1.4.6-recovery-candidate',
              'build_id': 'REC-RT8-M6-20260724-03',
          }
          critical = result['checks']['critical_pytest']
          assert critical['exit_code'] == 0
          assert len(critical['files']) == 26
          assert all(item['exit_code'] == 0 for item in critical['files'].values())
          assert result['checks']['javascript']['exit_code'] == 0
          assert result['backend_selftest']['status'] == 'PASS'
          print('SOURCE_GATE_26_OF_26_PASS')
          PY

      - name: Build deterministic 1.4.6 source ZIP twice and write evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import stat
          import zipfile
          from pathlib import Path

          root = Path('recovery/source')
          dist = Path('recovery/dist')
          evidence_dir = Path('recovery/evidence')
          dist.mkdir(parents=True, exist_ok=True)
          evidence_dir.mkdir(parents=True, exist_ok=True)
          deny = {'.git', '__pycache__', '.pytest_cache', 'data', 'runtime-data', 'user-data'}
          files = []
          for source in root.rglob('*'):
              if not source.is_file():
                  continue
              rel = source.relative_to(root)
              if set(rel.parts).intersection(deny) or source.suffix == '.pyc':
                  continue
              files.append((rel.as_posix(), source))
          files.sort(key=lambda item: item[0])

          def build(path: Path) -> None:
              with zipfile.ZipFile(path, 'w') as archive:
                  for rel, source in files:
                      info = zipfile.ZipInfo(rel, date_time=(2026, 7, 24, 0, 0, 0))
                      info.create_system = 3
                      info.external_attr = (stat.S_IFREG | 0o644) << 16
                      info.compress_type = zipfile.ZIP_DEFLATED
                      archive.writestr(
                          info,
                          source.read_bytes(),
                          compress_type=zipfile.ZIP_DEFLATED,
                          compresslevel=9,
                      )

          first = dist / 'source-146-a.zip'
          second = dist / 'source-146-b.zip'
          build(first)
          build(second)
          data = first.read_bytes()
          assert data == second.read_bytes(), 'source ZIP builds differ'
          source_sha = hashlib.sha256(data).hexdigest()
          assert source_sha == '476b68ee2ddea5f2985c1c8fd2fc841de490a866bb3a9676aca9411b463e6538'
          members_sha = hashlib.sha256('\n'.join(rel for rel, _ in files).encode('utf-8')).hexdigest()
          assert len(files) == 87
          assert members_sha == 'b0c43a785c437bf649750a5541386b81b6436c160aad07a5aa6903265581e2fe'
          final_zip = dist / 'ImageLab_by_LarannA_RECOVERY_1.4.6_SOURCE.zip'
          final_zip.write_bytes(data)
          first.unlink()
          second.unlink()
          manifest = {
              'schema': 1,
              'status': 'PASS',
              'identity': {
                  'version': '1.4.6-recovery-candidate',
                  'build_id': 'REC-RT8-M6-20260724-03',
              },
              'file': final_zip.name,
              'sha256': source_sha,
              'size_bytes': len(data),
              'member_count': len(files),
              'members_sha256': members_sha,
              'reproducible_builds': 2,
              'builds_byte_identical': True,
          }
          (dist / 'source-manifest-1.4.6.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', 'utf-8'
          )
          source_gate = json.loads((evidence_dir / 'source-gate-recovery-1.4.6.json').read_text('utf-8'))
          complete = {
              'schema': 1,
              'status': 'PASS_SOURCE_RECOVERY_INCREMENT',
              'identity': manifest['identity'],
              'parent': {
                  'version': '1.4.5-recovery-candidate',
                  'build_id': 'REC-RT8-M6-20260724-02',
                  'source_sha256': 'e4268157d6abc5495eefa9799b09a5352d43102019c4f0047f7303597f6c2ea7',
              },
              'patch_sha256': '023b83a9d449fdad27aa5e63610cd12ef7fa8d2bee8fb67b481a31815adfa799',
              'recovered_cluster': {
                  'id': 'RC-10',
                  'name': 'bounded installer PID wait without descendant-tree hang',
                  'status': 'PASS',
              },
              'checks': {
                  'full_pytest': '143/143 PASS',
                  'required_test_files': '26/26 PASS',
                  'compileall': 'PASS',
                  'javascript_syntax': 'PASS',
                  'backend_selftest': source_gate['backend_selftest']['status'],
                  'source_zip_reproducibility': '2/2 BYTE_IDENTICAL',
              },
              'source_bundle': manifest,
              'claim_boundary': {
                  'source_recovery_increment': 'PASS',
                  'windows_clean_install': 'NOT_YET_REPEATED_FOR_1.4.6',
                  'windows_independent_rerun': 'NOT_YET_REPEATED_FOR_1.4.6',
                  'update_rollback': 'UNVERIFIED',
                  'physical_user_path_L5': 'UNVERIFIED',
                  'release': 'BLOCKED',
              },
          }
          (evidence_dir / 'recovery-increment-1.4.6.json').write_text(
              json.dumps(complete, ensure_ascii=False, indent=2) + '\n', 'utf-8'
          )
          print(json.dumps(complete, ensure_ascii=False, indent=2))
          PY

      - name: Commit verified RC-10 source and bundle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ImageLab Recovery Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add recovery/source recovery/evidence recovery/dist
          if git diff --cached --quiet; then
            echo 'Verified RC-10 output is already committed.'
            exit 0
          fi
          git commit -m 'recovery: bound installer wait to exact PID [recovery-rc10-output]'
          for attempt in 1 2 3; do
            if git push origin HEAD:bootstrap/zero-trust-gate; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            git fetch origin bootstrap/zero-trust-gate
            git rebase origin/bootstrap/zero-trust-gate
          done

      - name: Upload RC-10 recovery evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: imagelab-recovery-1.4.6-rc10
          path: |
            recovery/evidence/source-gate-recovery-1.4.6.json
            recovery/evidence/recovery-increment-1.4.6.json
            recovery/dist/ImageLab_by_LarannA_RECOVERY_1.4.6_SOURCE.zip
            recovery/dist/source-manifest-1.4.6.json
            ${{ runner.temp }}/pytest-full.log
            ${{ runner.temp }}/pytest-full.xml
          if-no-files-found: warn
          retention-days: 30
