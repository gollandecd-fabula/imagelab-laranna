name: RETIRED — Historical recovery patch applier

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: retired-recovery-apply-verified-patch
  cancel-in-progress: false

jobs:
  retired:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail closed
        run: |
          echo "This historical workflow is retired and cannot change repository or release state."
          exit 1
