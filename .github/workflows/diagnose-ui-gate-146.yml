name: Diagnose ImageLab 1.4.6 UI Gate

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/diagnose-ui-gate-146.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  SOURCE_RUN_ID: '30106203909'
  EXPECTED_VERSION: '1.4.6-recovery-candidate'
  EXPECTED_BUILD_ID: 'REC-RT8-M6-20260724-03'
  EXPECTED_SOURCE_SHA256: '476b68ee2ddea5f2985c1c8fd2fc841de490a866bb3a9676aca9411b463e6538'
  EXPECTED_INSTALLER_SHA256: 'f67aac4ac412d4b934fc672bc25cf949e36ec54c02b3bb2fd5277a7f1d5c180f'

jobs:
  diagnose-clean-ui:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Download exact source tree from B0
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: bootstrap-source-tree
          path: source-tree
          repository: gollandecd-fabula/imagelab-laranna
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download exact Windows candidate from B2
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: UNVERIFIED_BOOTSTRAP_WINDOWS_CANDIDATE
          path: exact-candidate
          repository: gollandecd-fabula/imagelab-laranna
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13.14'

      - name: Verify downloaded identities
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force diagnostics-clean | Out-Null
          $sourceVersion = Select-String -Path source-tree/app/config.py -Pattern [regex]::Escape($env:EXPECTED_VERSION) -Quiet
          $sourceBuild = Select-String -Path source-tree/app/config.py -Pattern [regex]::Escape($env:EXPECTED_BUILD_ID) -Quiet
          if (-not $sourceVersion -or -not $sourceBuild) { throw 'Downloaded source identity mismatch' }
          $installer = (Get-ChildItem exact-candidate -Filter *.exe -File | Select-Object -First 1).FullName
          if (-not $installer) { throw 'Installer missing' }
          $installerSha = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          if ($installerSha -ne $env:EXPECTED_INSTALLER_SHA256) { throw "Installer SHA mismatch: $installerSha" }
          @{
            schema = 1
            status = 'PASS'
            source_run_id = $env:SOURCE_RUN_ID
            expected_version = $env:EXPECTED_VERSION
            expected_build_id = $env:EXPECTED_BUILD_ID
            installer_path = $installer
            installer_sha256 = $installerSha
          } | ConvertTo-Json | Set-Content diagnostics-clean/input-identity.json -Encoding utf8

      - name: Install and inspect browser harness
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --requirement source-tree/requirements.txt *>&1 | Tee-Object diagnostics-clean/pip-runtime.log
          python -m pip install --requirement source-tree/requirements-release.txt *>&1 | Tee-Object diagnostics-clean/pip-release.log
          python -m playwright install chromium *>&1 | Tee-Object diagnostics-clean/playwright-install.log
          python -c "import sys, PIL, playwright; print(sys.version); print(PIL.__version__); print(playwright.__file__)" *>&1 | Tee-Object diagnostics-clean/python-imports.log
          python -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(headless=True, channel='msedge'); print(b.version); b.close(); p.stop()" *>&1 | Tee-Object diagnostics-clean/browser-smoke-msedge.log

      - name: Run exact clean UI harness with full capture
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force evidence-clean-diagnostic | Out-Null
          $installer = (Get-ChildItem exact-candidate -Filter *.exe -File | Select-Object -First 1).FullName
          try {
            & ./source-tree/release_gate/run_clean_install_gate.ps1 `
              -InstallerPath $installer `
              -CandidateManifestPath exact-candidate/candidate-manifest.json `
              -EvidenceDir evidence-clean-diagnostic `
              -Mode clean `
              -BrowserChannel msedge *>&1 | Tee-Object diagnostics-clean/harness-combined.log
            $exit = if ($?) { 0 } else { 1 }
          } catch {
            $_ | Format-List * -Force | Out-String | Tee-Object -FilePath diagnostics-clean/harness-exception.log
            $exit = 1
          }
          @{
            schema = 1
            status = if ($exit -eq 0) { 'PASS' } else { 'FAIL' }
            last_exit_code = $LASTEXITCODE
            powershell_success = $?
          } | ConvertTo-Json | Set-Content diagnostics-clean/harness-result.json -Encoding utf8
          exit 0

      - name: Enumerate diagnostic outputs
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem -Recurse diagnostics-clean,evidence-clean-diagnostic -File -ErrorAction SilentlyContinue |
            Select-Object FullName,Length,LastWriteTimeUtc |
            ConvertTo-Json -Depth 4 |
            Set-Content diagnostics-clean/file-index.json -Encoding utf8

      - name: Upload exact UI diagnostics
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: imagelab-1.4.6-clean-ui-diagnostics
          path: |
            diagnostics-clean/
            evidence-clean-diagnostic/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  diagnose-independent-ui:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Download exact source tree from B0
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: bootstrap-source-tree
          path: source-tree
          repository: gollandecd-fabula/imagelab-laranna
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download exact Windows candidate from B2
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: UNVERIFIED_BOOTSTRAP_WINDOWS_CANDIDATE
          path: exact-candidate
          repository: gollandecd-fabula/imagelab-laranna
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13.14'

      - name: Install and inspect bundled browser harness
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force diagnostics-independent | Out-Null
          python -m pip install --requirement source-tree/requirements.txt *>&1 | Tee-Object diagnostics-independent/pip-runtime.log
          python -m pip install --requirement source-tree/requirements-release.txt *>&1 | Tee-Object diagnostics-independent/pip-release.log
          python -m playwright install chromium *>&1 | Tee-Object diagnostics-independent/playwright-install.log
          python -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(headless=True); print(b.version); b.close(); p.stop()" *>&1 | Tee-Object diagnostics-independent/browser-smoke-bundled.log

      - name: Run exact independent UI harness with full capture
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force evidence-independent-diagnostic | Out-Null
          $installer = (Get-ChildItem exact-candidate -Filter *.exe -File | Select-Object -First 1).FullName
          try {
            & ./source-tree/release_gate/run_clean_install_gate.ps1 `
              -InstallerPath $installer `
              -CandidateManifestPath exact-candidate/candidate-manifest.json `
              -EvidenceDir evidence-independent-diagnostic `
              -Mode independent `
              -BrowserChannel bundled *>&1 | Tee-Object diagnostics-independent/harness-combined.log
            $exit = if ($?) { 0 } else { 1 }
          } catch {
            $_ | Format-List * -Force | Out-String | Tee-Object -FilePath diagnostics-independent/harness-exception.log
            $exit = 1
          }
          @{
            schema = 1
            status = if ($exit -eq 0) { 'PASS' } else { 'FAIL' }
            last_exit_code = $LASTEXITCODE
            powershell_success = $?
          } | ConvertTo-Json | Set-Content diagnostics-independent/harness-result.json -Encoding utf8
          exit 0

      - name: Enumerate diagnostic outputs
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem -Recurse diagnostics-independent,evidence-independent-diagnostic -File -ErrorAction SilentlyContinue |
            Select-Object FullName,Length,LastWriteTimeUtc |
            ConvertTo-Json -Depth 4 |
            Set-Content diagnostics-independent/file-index.json -Encoding utf8

      - name: Upload exact UI diagnostics
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: imagelab-1.4.6-independent-ui-diagnostics
          path: |
            diagnostics-independent/
            evidence-independent-diagnostic/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
