name: SINDEL C05C Donor Split Core 450 20260917

on:
  push:
    branches:
      - sindel-cp034-a01-parity-gate-r5-20260917
    paths:
      - '.github/workflows/sindel-c05c-donor-split-core-450-20260917.yml'

permissions:
  actions: read
  contents: read

jobs:
  split-core-450:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download qualified 9-PTE artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p donor_models
          gh run download 35204283725 -n SINDEL_C05C_DONOR_9PTE_20260917 -D donor_models

      - name: Verify exact core hashes and split at 450 MB
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          expected={
            't3_prefill.pte':('721d268943818b5a90530e7dadfae0edb9d3fd0227f93557c2a153ecee675e51',2116538624),
            't3_decode.pte':('0704783d9c4c7c621f9f398de40d8fc3829ad2769bca8194505cd86f0aee9ca3',2098677504),
            's3gen_encoder.pte':('4f087015bb08526d0689eed1f94baa60761d1777d37b25f7944d6f4944ecce88',185724864),
            'cfm_step.pte':('5ffb90558c0dbada80ac94bd9a6864101cc07826c0f9192dfd0363d190922079',286434240),
            'hifigan.pte':('f5239799e82fb2be2aeb63db2de9bef676d2decf7905692a5ccafac7ae3530e2',83634944),
          }
          root=Path('donor_models'); out=Path('parts'); out.mkdir()
          chunk=450_000_000
          manifest={'schema':'sindel.cp034.c05c.donor-core-split.v2','chunk_bytes':chunk,'files':[],'source_run':35204283725}
          for name,(want_sha,want_size) in expected.items():
            p=root/name
            if not p.is_file() or p.stat().st_size!=want_size: raise SystemExit(f'SIZE_FAIL:{name}')
            h=hashlib.sha256()
            with p.open('rb') as f:
              for b in iter(lambda:f.read(8*1024*1024),b''): h.update(b)
            got=h.hexdigest()
            if got!=want_sha: raise SystemExit(f'SHA_FAIL:{name}:{got}')
            row={'name':name,'size':want_size,'sha256':got,'parts':[]}
            with p.open('rb') as f:
              i=0
              while True:
                b=f.read(chunk)
                if not b: break
                q=out/f'{name}.part{i:02d}'; q.write_bytes(b)
                row['parts'].append({'name':q.name,'size':len(b),'sha256':hashlib.sha256(b).hexdigest()})
                i+=1
            manifest['files'].append(row)
          Path('parts/CORE_SPLIT_MANIFEST.json').write_text(json.dumps(manifest,indent=2,sort_keys=True),encoding='utf-8')
          print(json.dumps(manifest,indent=2))
          PY

      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with: {name: core_manifest_450, path: parts/CORE_SPLIT_MANIFEST.json, retention-days: 1}

      - name: Upload prefill 00
        uses: actions/upload-artifact@v4
        with: {name: prefill_450_00, path: parts/t3_prefill.pte.part00, compression-level: 0, retention-days: 1}
      - name: Upload prefill 01
        uses: actions/upload-artifact@v4
        with: {name: prefill_450_01, path: parts/t3_prefill.pte.part01, compression-level: 0, retention-days: 1}
      - name: Upload prefill 02
        uses: actions/upload-artifact@v4
        with: {name: prefill_450_02, path: parts/t3_prefill.pte.part02, compression-level: 0, retention-days: 1}
      - name: Upload prefill 03
        uses: actions/upload-artifact@v4
        with: {name: prefill_450_03, path: parts/t3_prefill.pte.part03, compression-level: 0, retention-days: 1}
      - name: Upload prefill 04
        uses: actions/upload-artifact@v4
        with: {name: prefill_450_04, path: parts/t3_prefill.pte.part04, compression-level: 0, retention-days: 1}

      - name: Upload decode 00
        uses: actions/upload-artifact@v4
        with: {name: decode_450_00, path: parts/t3_decode.pte.part00, compression-level: 0, retention-days: 1}
      - name: Upload decode 01
        uses: actions/upload-artifact@v4
        with: {name: decode_450_01, path: parts/t3_decode.pte.part01, compression-level: 0, retention-days: 1}
      - name: Upload decode 02
        uses: actions/upload-artifact@v4
        with: {name: decode_450_02, path: parts/t3_decode.pte.part02, compression-level: 0, retention-days: 1}
      - name: Upload decode 03
        uses: actions/upload-artifact@v4
        with: {name: decode_450_03, path: parts/t3_decode.pte.part03, compression-level: 0, retention-days: 1}
      - name: Upload decode 04
        uses: actions/upload-artifact@v4
        with: {name: decode_450_04, path: parts/t3_decode.pte.part04, compression-level: 0, retention-days: 1}

      - name: Upload s3gen
        uses: actions/upload-artifact@v4
        with: {name: s3gen_450, path: parts/s3gen_encoder.pte.part00, compression-level: 0, retention-days: 1}
      - name: Upload cfm
        uses: actions/upload-artifact@v4
        with: {name: cfm_450, path: parts/cfm_step.pte.part00, compression-level: 0, retention-days: 1}
      - name: Upload hifigan
        uses: actions/upload-artifact@v4
        with: {name: hifigan_450, path: parts/hifigan.pte.part00, compression-level: 0, retention-days: 1}
