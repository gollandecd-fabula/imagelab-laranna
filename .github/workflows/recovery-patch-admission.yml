name: Recovery Patch Admission RC04-09

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/recovery-patch-admission.yml
      - recovery/patches/rc-04-09/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admit-patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact recovery branch
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: bootstrap/zero-trust-gate
          fetch-depth: 0

      - name: Set up exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13.14'

      - name: Verify parts, decode patch and check applicability
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p recovery/evidence
          python - <<'PY'
          from __future__ import annotations
          import base64
          import gzip
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          expected_parts = {
              'part-00.b64': ('6ccc31e7c7a2e59b4f6e246eda701bc90bd77948ad8a288bded557e936ac8531', 4096),
              'part-01.b64': ('973d179f5533c9d9558cb714bd556ba0b5113d0b54c984f4b6525713879fe0a8', 4096),
              'part-02.b64': ('0f2e0bdc26f1e7bbc0682084c522d0c719a29dfffe8e2a78f2667df73df84c77', 4096),
              'part-03.b64': ('b69413da987f8ec6eb733e8c3fa61211379f50e2c6241767377d3fc13a46a0e6', 4096),
              'part-04.b64': ('7ff3ed250161a9410afb8327400ec3b4b5985eb4fb67e7fced38a54373078b0a', 4096),
              'part-05.b64': ('57e3966bc7587fec6bff945b6a962d34fbfa1da7af078dc9e2766314d999054d', 4096),
              'part-06.b64': ('e69c0c665eebed81c5f16e506385dc9d975a915e790d9061801ed680242b77d4', 4096),
              'part-07.b64': ('1472fa58b5a291d48750af767a7440de64dc267c09920118bda79d52e2eafe7e', 2400),
          }
          root = Path('recovery/patches/rc-04-09')
          result = {
              'schema': 1,
              'status': 'FAIL',
              'expected': {
                  'combined_base64_sha256': '499aab619bb6d1bd6cac8b3a9cf656197f6dd7006fd91627c92f4e434b70fee8',
                  'gzip_sha256': '4101fedd2609e0574c4028dca228588c42bd53e0d92fa1c348d271745253249a',
                  'patch_sha256': '137640abe5810913c8870bec55a10284e1b7bf2589db84366a7c3d3ce451397d',
              },
              'parts': {},
              'failures': [],
          }
          combined = bytearray()
          for name, (expected_sha, expected_size) in expected_parts.items():
              path = root / name
              if not path.is_file():
                  result['failures'].append(f'MISSING:{name}')
                  continue
              data = path.read_bytes()
              actual_sha = hashlib.sha256(data).hexdigest()
              result['parts'][name] = {
                  'size': len(data),
                  'expected_size': expected_size,
                  'sha256': actual_sha,
                  'expected_sha256': expected_sha,
              }
              if len(data) != expected_size:
                  result['failures'].append(f'SIZE:{name}')
              if actual_sha != expected_sha:
                  result['failures'].append(f'SHA256:{name}')
              combined.extend(data)

          combined_bytes = bytes(combined)
          result['combined_base64_size'] = len(combined_bytes)
          result['combined_base64_sha256'] = hashlib.sha256(combined_bytes).hexdigest()
          if result['combined_base64_sha256'] != result['expected']['combined_base64_sha256']:
              result['failures'].append('COMBINED_BASE64_SHA256')

          patch_bytes = b''
          if not result['failures']:
              try:
                  gzip_bytes = base64.b64decode(combined_bytes, validate=True)
                  result['gzip_size'] = len(gzip_bytes)
                  result['gzip_sha256'] = hashlib.sha256(gzip_bytes).hexdigest()
                  if result['gzip_sha256'] != result['expected']['gzip_sha256']:
                      result['failures'].append('GZIP_SHA256')
                  patch_bytes = gzip.decompress(gzip_bytes)
                  result['patch_size'] = len(patch_bytes)
                  result['patch_sha256'] = hashlib.sha256(patch_bytes).hexdigest()
                  if result['patch_sha256'] != result['expected']['patch_sha256']:
                      result['failures'].append('PATCH_SHA256')
              except Exception as exc:
                  result['failures'].append(f'DECODE:{type(exc).__name__}:{exc}')

          if patch_bytes and not result['failures']:
              patch_path = Path('/tmp/rc04-09.patch')
              patch_path.write_bytes(patch_bytes)
              check = subprocess.run(
                  ['git', 'apply', '--check', '--directory=recovery/source', str(patch_path)],
                  text=True,
                  capture_output=True,
                  check=False,
              )
              result['git_apply_check'] = {
                  'exit_code': check.returncode,
                  'stdout': check.stdout[-10000:],
                  'stderr': check.stderr[-10000:],
                  'directory': 'recovery/source',
              }
              if check.returncode != 0:
                  result['failures'].append('GIT_APPLY_CHECK')

          result['status'] = 'PASS' if not result['failures'] else 'FAIL'
          evidence = Path('recovery/evidence/rc04-09-patch-admission.json')
          evidence.write_text(json.dumps(result, ensure_ascii=False, indent=2) + '\n', 'utf-8')
          print(json.dumps(result, ensure_ascii=False, indent=2))
          raise SystemExit(0 if result['status'] == 'PASS' else 1)
          PY

      - name: Upload forensic admission evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: imagelab-rc04-09-patch-admission
          path: recovery/evidence/rc04-09-patch-admission.json
          if-no-files-found: error
          retention-days: 30
