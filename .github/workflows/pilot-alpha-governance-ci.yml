name: ImageLab Pilot Alpha Governance Guard

on:
  pull_request:
    branches: [redteam/imagelab-complete-audit-20260725-v2]
  push:
    branches: [pilot/controlled-vertical-alpha-v1-3-1]

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Bind exact Pilot candidate SHA
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          require_exact() { test "$1" = "$2"; }
          require_exact "$actual" "$expected" || { echo "::error::candidate mismatch actual=$actual expected=$expected"; exit 1; }
          mismatch="${expected%?}0"
          test "$mismatch" != "$expected" || mismatch="${expected%?}1"
          if require_exact "$actual" "$mismatch"; then
            echo "::error::mismatched-SHA negative fixture was accepted"
            exit 1
          fi
          printf 'exact_candidate_sha=%s\n' "$actual"
      - name: Require governance artifacts
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            recovery/source/docs/IMAGELAB_EXECUTION_SPEC_V1_3_1_APPROVED.md \
            recovery/source/docs/PILOT_DELTA_RTM_V1_3_1_APPROVED.md \
            recovery/source/docs/PILOT_CHANGE_REGISTER_V1_3_1_APPROVED.md \
            recovery/source/docs/PILOT_BASELINE_MANIFEST_V1_3_1.json \
            .github/workflows/pilot-alpha-governance-ci.yml
          do
            test -s "$path" || { echo "::error::missing $path"; exit 1; }
          done
      - name: Build Frozen Pilot Set v1
        shell: bash
        run: |
          set -euo pipefail
          python recovery/source/tools/generate_pilot_frozen_set.py
      - name: Validate Frozen Pilot Set v1
        shell: bash
        run: |
          set -euo pipefail
          python recovery/source/tests/test_pilot_frozen_set.py
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: ImageLab-Frozen-Pilot-Set-v1-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            recovery/source/tests/fixtures/pilot_v1/manifest.json
            recovery/source/tests/fixtures/pilot_v1/generated/
          retention-days: 30
          if-no-files-found: error
      - name: Require exact baseline ancestry
        shell: bash
        run: |
          set -euo pipefail
          baseline=410841404d3afc2788b8a01d2166699beb1cfc27
          git merge-base --is-ancestor "$baseline" HEAD || {
            echo "::error::not descended from exact baseline $baseline"
            exit 1
          }
      - name: Block prohibited surfaces
        shell: bash
        run: |
          set -euo pipefail
          baseline=410841404d3afc2788b8a01d2166699beb1cfc27
          changed="$(git diff --name-only "$baseline"...HEAD)"
          prohibited='(^|/)(installer|installers|release|releases|genesis|marketplace|billing|kubernetes|k8s|terraform|temporal|oidc|saas)(/|$)|(^|/)(Dockerfile|docker-compose\.ya?ml)$'
          if printf '%s\n' "$changed" | grep -Eiq "$prohibited"; then
            printf '%s\n' "$changed"
            echo "::error::Pilot Alpha touched a prohibited surface"
            exit 1
          fi
      - name: Block prohibited completion claims
        shell: bash
        run: |
          set -euo pipefail
          baseline=410841404d3afc2788b8a01d2166699beb1cfc27
          guard=.github/workflows/pilot-alpha-governance-ci.yml
          pattern='M2A_COMPLETE|M2B_COMPLETE|PRODUCTION_READY|RELEASE_AUTHORIZED|GENESIS_RELEASE_AUTHORIZED'

          contains_prohibited_claim() {
            local path
            for path in "$@"; do
              if grep -nE "$pattern" "$path"; then
                return 0
              fi
            done
            return 1
          }

          mapfile -d '' -t changed_paths < <(
            git diff --name-only -z --diff-filter=ACMR "$baseline"...HEAD -- \
              recovery/source/app recovery/source/tests .github/workflows
          )
          candidate_paths=()
          for path in "${changed_paths[@]}"; do
            [[ "$path" == "$guard" ]] && continue
            candidate_paths+=("$path")
          done

          grep -qE "$pattern" "$guard" || {
            echo "::error::guard self-test fixture is missing the prohibited pattern declaration"
            exit 1
          }
          for path in "${candidate_paths[@]}"; do
            [[ "$path" != "$guard" ]] || {
              echo "::error::guard file leaked into the completion-claim scan"
              exit 1
            }
          done

          negative_fixture="$(mktemp)"
          trap 'rm -f "$negative_fixture"' EXIT
          printf 'status = "RELEASE_AUTHORIZED"\n' > "$negative_fixture"
          contains_prohibited_claim "$negative_fixture" || {
            echo "::error::negative fixture was not detected"
            exit 1
          }

          if ((${#candidate_paths[@]})) && contains_prohibited_claim "${candidate_paths[@]}"; then
            echo "::error::prohibited completion claim found in Pilot Alpha changes"
            exit 1
          fi
      - name: Validate baseline manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("recovery/source/docs/PILOT_BASELINE_MANIFEST_V1_3_1.json").read_text("utf-8"))
          assert data["exact_baseline_sha"] == "410841404d3afc2788b8a01d2166699beb1cfc27"
          assert data["rollback_sha"] == data["exact_baseline_sha"]
          assert data["release_status"] == "RELEASE_BLOCKED"
          assert data["claims"]["pilot_candidate"] is None
          assert data["claims"]["release_authorized"] is False
          print("pilot baseline manifest: PASS")
          PY
